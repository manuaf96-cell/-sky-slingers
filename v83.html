<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Slingers V83</title><style>body{margin:0;background:#08152e;color:#fff;font-family:system-ui;text-align:center;padding:7vh 5vw}.box{max-width:720px;margin:auto;background:#101b35dd;border:1px solid #ffffff22;border-radius:24px;padding:24px}button{font-size:17px;font-weight:800;padding:13px 16px;margin:5px;border:0;border-radius:15px;background:#526da8;color:#fff}input{padding:11px;border-radius:12px;border:0;text-align:center;font-size:17px;width:90px}.small{opacity:.8}.row{background:#ffffff0b;border:1px solid #ffffff14;border-radius:14px;padding:9px;margin:7px 0;text-align:left}.danger{background:#7a3f57}.secondary{background:#3d7c67}#file{display:none}</style><div class=box><div style="font-size:56px">🧪</div><h1>Sky Slingers V83</h1><p>Test Lab con cronologia esportabile e ripristinabile.</p><p class=small>Salva le configurazioni recenti in un file JSON oppure importale su un altro dispositivo senza toccare il progresso normale.</p><label>Livello 1–60<br><input id=l type=number min=1 max=60 value=1></label><br><button onclick="go()">🚀 AVVIA TEST</button><button onclick="go(1)">🛡️ INVINCIBILE</button><button onclick="resume()">▶️ RIPRENDI ULTIMO</button><button class=secondary onclick="exportHistory()">⬇️ ESPORTA CRONOLOGIA</button><button class=secondary onclick="file.click()">⬆️ IMPORTA CRONOLOGIA</button><input id=file type=file accept=application/json,.json onchange="importHistory(event)"><button class=danger onclick="clearAll()">🧹 SVUOTA CRONOLOGIA</button><p id=m class=small></p><div id=h></div></div><script>const G='skySlingers60',B='skySlingersNormalBackup',H='skySlingersTestHistory';function clamp(v){const n=Number(v);return Number.isFinite(n)?Math.max(1,Math.min(60,Math.floor(n))):1}function backup(){if(!localStorage.getItem(B)){const v=localStorage.getItem(G);if(v)localStorage.setItem(B,v)}}function sanitize(x){return x&&Number.isFinite(Number(x.level))?{level:clamp(x.level),invincible:!!x.invincible,at:typeof x.at==='string'?x.at:new Date().toISOString()}:null}function read(){try{const a=JSON.parse(localStorage.getItem(H)||'[]');return Array.isArray(a)?a.map(sanitize).filter(Boolean).slice(0,5):[]}catch(e){return[]}}function write(a){localStorage.setItem(H,JSON.stringify(a.slice(0,5)));render()}function render(){const a=read();h.innerHTML=a.length?a.map((x,i)=>'<div class=row><b>#'+(i+1)+'</b> · livello '+x.level+' · '+(x.invincible?'🛡️ invincibile':'⚔️ normale')+'<br><button onclick="useHistory('+i+')">▶️ USA</button></div>').join(''):'<p class=small>Nessun test recente.</p>'}function go(inv){backup();const n=clamp(l.value),item={level:n,invincible:!!inv,at:new Date().toISOString()};write([item,...read().filter(x=>x.level!==n||x.invincible!==!!inv)]);localStorage.setItem(G,JSON.stringify({level:n,coins:99999,gems:99999,score:999999,lives:inv?9999:99,hero:7,weapon:24,wxp:99999,wlv:30,forge:20,combo:0,treasures:999,kills:9999,shots:9999,pity:0,frags:99999,owned:Array.from({length:25},(_,x)=>x),demo:true,invincible:!!inv}));m.textContent='Apertura demo…';setTimeout(()=>location.href='index.html?demo=1&v=83',150)}function useHistory(i){const x=read()[i];if(!x)return;l.value=x.level;go(x.invincible)}function resume(){const x=read()[0];if(!x){m.textContent='Nessun test precedente disponibile.';return}l.value=x.level;go(x.invincible)}function exportHistory(){const blob=new Blob([JSON.stringify({version:83,history:read()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sky-slingers-test-history-v83.json';a.click();URL.revokeObjectURL(a.href);m.textContent='Cronologia esportata.'}function importHistory(e){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result),incoming=Array.isArray(data)?data:data.history;if(!Array.isArray(incoming))throw Error();const merged=[...incoming.map(sanitize).filter(Boolean),...read()];const unique=[];for(const x of merged){if(!unique.some(y=>y.level===x.level&&y.invincible===x.invincible))unique.push(x);if(unique.length===5)break}write(unique);m.textContent='Cronologia importata in modo sicuro.'}catch(_){m.textContent='File non valido: nessuna modifica applicata.'}file.value=''}};r.readAsText(f)}function clearAll(){localStorage.removeItem(H);m.textContent='Cronologia cancellata.';render()}render()</script></html>
