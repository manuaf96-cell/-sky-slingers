<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Slingers V79 — Test Lab</title><style>body{margin:0;background:linear-gradient(160deg,#08152e,#132a55);color:#fff;font-family:system-ui;text-align:center;padding:6vh 6vw}h1{font-size:clamp(30px,8vw,52px);margin:8px 0}button{font-size:17px;font-weight:800;padding:13px 16px;margin:6px;border:0;border-radius:15px;background:#526da8;color:white;box-shadow:0 5px 18px #0006}input,select{padding:12px;border-radius:12px;border:0;text-align:center;font-size:17px}.box{max-width:700px;margin:auto;background:#101b35dd;border:1px solid #ffffff22;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0008}.small{opacity:.78}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:560px;margin:14px auto}.grid button{margin:0;font-size:15px}.danger{background:#7d3548}.ok{background:#3a7a62}.restore{background:#8b6b2c}.normal{background:#3d5a86}.accent{background:#6d4da8}.clean{background:#754d8f}#msg{min-height:24px}</style><div class=box><div style="font-size:58px">🧪</div><h1>Sky Slingers V79<br>TEST LAB</h1><p>Tutto sbloccato per provare il gioco senza grind.</p><p>🔓 25 armi · 🦸 8 eroi · 💎 99.999 · 🪙 99.999 · ⚔️ arma LV30 · 🔨 forgia 20</p><p class=small>Il backup del salvataggio normale viene creato una sola volta e non viene sovrascritto.</p><label>Preset di test<br><select id=preset onchange="applyPreset()"><option value="custom">Personalizzato</option><option value="start">Inizio campagna</option><option value="mid">Metà campagna</option><option value="boss">Boss finale</option></select></label><br><label>Livello di partenza<br><input id=level type=number min=1 max=60 value=1 inputmode=numeric></label><div class=grid><button onclick="start()">🚀 AVVIA TEST</button><button onclick="start(1)">🌱 LIV 1</button><button onclick="start(30)">⚔️ LIV 30</button><button onclick="start(60)">👑 BOSS 60</button><button class=ok onclick="start(1,true)">🛡️ INVINCIBILE 1</button><button class=ok onclick="start(60,true)">🛡️ INVINCIBILE 60</button><button class=accent onclick="start(30,true)">🧪 TEST COMPLETO</button></div><button class=normal onclick="normal()">🎮 APRI GIOCO NORMALE</button><button class=restore onclick="restoreNormal()">↩️ RIPRISTINA PROGRESSI NORMALI</button><button class=danger onclick="resetDemo()">♻️ RESET DEMO</button><button class=clean onclick="clearDemo()">🧹 PULISCI SOLO DEMO</button><p id=msg class=small></p></div><script>const G='skySlingers60',B='skySlingersNormalBackup';function backup(){if(!localStorage.getItem(B)){const v=localStorage.getItem(G);if(v)localStorage.setItem(B,v)}}function clampLevel(v){const n=Number(v);return Number.isFinite(n)?Math.max(1,Math.min(60,Math.floor(n))):1}function data(l,i){return{level:clampLevel(l),coins:99999,gems:99999,score:999999,lives:i?9999:99,hero:7,weapon:24,wxp:99999,wlv:30,forge:20,combo:0,treasures:999,kills:9999,shots:9999,pity:0,frags:99999,owned:Array.from({length:25},(_,n)=>n),demo:true,invincible:!!i}}function applyPreset(){const v=preset.value;if(v==='start')level.value=1;if(v==='mid')level.value=30;if(v==='boss')level.value=60}function start(l,i){backup();const n=typeof l==='number'?l:clampLevel(level.value);level.value=n;localStorage.setItem(G,JSON.stringify(data(n,i)));msg.textContent='Apertura demo…';setTimeout(()=>location.href='index.html?demo=1&v=79',200)}function normal(){const v=localStorage.getItem(B);if(v){localStorage.setItem(G,v);localStorage.removeItem(B)}location.href='index.html?normal=1&v=79'}function restoreNormal(){const v=localStorage.getItem(B);if(v){localStorage.setItem(G,v);localStorage.removeItem(B);msg.textContent='Progresso normale ripristinato.'}else msg.textContent='Nessun backup trovato.'}function resetDemo(){const v=localStorage.getItem(B);if(v){localStorage.setItem(G,v);localStorage.removeItem(B);msg.textContent='Demo chiusa e progresso normale ripristinato.'}else{localStorage.removeItem(G);msg.textContent='Dati demo cancellati.'}}function clearDemo(){localStorage.removeItem(G);msg.textContent='Dati demo cancellati. Il backup normale è rimasto intatto.'}</script></html>
