<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Slingers V82</title><style>body{margin:0;background:#08152e;color:#fff;font-family:system-ui;text-align:center;padding:7vh 5vw}.box{max-width:720px;margin:auto;background:#101b35dd;border:1px solid #ffffff22;border-radius:24px;padding:24px}button{font-size:17px;font-weight:800;padding:13px 16px;margin:5px;border:0;border-radius:15px;background:#526da8;color:#fff}input{padding:11px;border-radius:12px;border:0;text-align:center;font-size:17px;width:90px}.small{opacity:.8}.row{background:#ffffff0b;border:1px solid #ffffff14;border-radius:14px;padding:9px;margin:7px 0;text-align:left}.danger{background:#7a3f57}</style><div class=box><div style="font-size:56px">🧪</div><h1>Sky Slingers V82</h1><p>Test Lab con cronologia degli ultimi test.</p><p class=small>La cronologia salva fino a 5 configurazioni recenti e permette di riprendere un test anche dopo averne avviato un altro.</p><label>Livello 1–60<br><input id=l type=number min=1 max=60 value=1></label><br><button onclick="go()">🚀 AVVIA TEST</button><button onclick="go(1)">🛡️ INVINCIBILE</button><button onclick="resume()">▶️ RIPRENDI ULTIMO</button><button class=danger onclick="clearAll()">🧹 SVUOTA CRONOLOGIA</button><p id=m class=small></p><div id=h></div></div><script>const G='skySlingers60',B='skySlingersNormalBackup',L='skySlingersLastTest',H='skySlingersTestHistory';function clamp(v){const n=Number(v);return Number.isFinite(n)?Math.max(1,Math.min(60,Math.floor(n))):1}function backup(){if(!localStorage.getItem(B)){const v=localStorage.getItem(G);if(v)localStorage.setItem(B,v)}}function read(){try{const a=JSON.parse(localStorage.getItem(H)||'[]');return Array.isArray(a)?a.filter(x=>x&&Number.isFinite(Number(x.level))).slice(0,5):[]}catch(e){return[]}}function write(a){localStorage.setItem(H,JSON.stringify(a.slice(0,5)));render()}function render(){const a=read();h.innerHTML=a.length?a.map((x,i)=>'<div class=row><b>#'+(i+1)+'</b> · livello '+clamp(x.level)+' · '+(x.invincible?'🛡️ invincibile':'⚔️ normale')+'<br><button onclick="useHistory('+i+')">▶️ USA</button></div>').join(''):'<p class=small>Nessun test recente.</p>'}function go(inv){backup();const n=clamp(l.value),item={level:n,invincible:!!inv,at:new Date().toISOString()};const a=[item,...read().filter(x=>clamp(x.level)!==n||!!x.invincible!==!!inv)];write(a);localStorage.setItem(L,JSON.stringify(item));localStorage.setItem(G,JSON.stringify({level:n,coins:99999,gems:99999,score:999999,lives:inv?9999:99,hero:7,weapon:24,wxp:99999,wlv:30,forge:20,combo:0,treasures:999,kills:9999,shots:9999,pity:0,frags:99999,owned:Array.from({length:25},(_,x)=>x),demo:true,invincible:!!inv}));m.textContent='Apertura demo…';setTimeout(()=>location.href='index.html?demo=1&v=82',150)}function useHistory(i){const a=read(),x=a[i];if(!x)return;l.value=clamp(x.level);go(!!x.invincible)}function resume(){const x=read()[0];if(!x){m.textContent='Nessun test precedente disponibile.';return}l.value=clamp(x.level);go(!!x.invincible)}function clearAll(){localStorage.removeItem(H);localStorage.removeItem(L);m.textContent='Cronologia cancellata.';render()}render()</script></html>
