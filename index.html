<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Sky Slingers V11</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10152b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}button{border:0;border-radius:15px;padding:11px 14px;margin:4px;font-weight:900}.dark{background:#293452;color:#fff}.hud{position:fixed;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:8px;z-index:2}.pill,.card{background:#18203bf2;border:1px solid #fff3;border-radius:18px;padding:10px}.panel{position:fixed;inset:0;background:#10152bf2;display:flex;align-items:center;justify-content:center;z-index:5}.card{width:min(92vw,540px);max-height:90vh;overflow:auto;text-align:center}.hidden{display:none!important}.row{display:flex;flex-wrap:wrap;justify-content:center}.item{background:#222d4d;border-radius:14px;padding:10px;margin:5px;text-align:left}.small{font-size:12px;opacity:.75}.skill{position:fixed;right:8px;bottom:18px;z-index:3}.dodge{position:fixed;left:8px;bottom:18px;z-index:3}.power{position:fixed;left:29%;bottom:30px;width:42%;height:9px;background:#1119;border-radius:8px;overflow:hidden}.power i{display:block;height:100%;width:0;background:#fff}.boss{position:fixed;left:12%;right:12%;top:58px;height:12px;background:#111b;border-radius:8px;overflow:hidden;display:none}.boss i{display:block;height:100%;background:#e33}.toast{position:fixed;top:22%;left:50%;transform:translateX(-50%);background:#10152bf5;padding:10px 16px;border-radius:14px;font-weight:900;opacity:0;z-index:9}.toast.on{opacity:1}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill" id="stats"></div><div class="pill" id="lv"></div></div><div class="boss" id="bb"><i></i></div><div class="power"><i id="pow"></i></div><button class="skill" id="skill">⚡ ABILITÀ</button><button class="dodge" id="dodge">💨 SCHIVATA</button><div id="toast" class="toast"></div><div id="menu" class="panel"><div class="card"><h1>☁️ Sky Slingers</h1><p>V11 · 15 armi · Missioni · Combo · Boss</p><div class="row"><button id="play">GIOCA</button><button class="dark" id="heroes">EROI</button><button class="dark" id="weapons">ARMI</button><button class="dark" id="gacha">GACHA</button><button class="dark" id="map">MAPPA</button><button class="dark" id="missions">MISSIONI</button></div><p class="small">Nuovo: missioni giornaliere, combo potenziata, ricompense e progressione più profonda.</p></div></div><div id="sub" class="panel hidden"><div class="card"><div id="content"></div><button class="dark" id="back">INDIETRO</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),K='skySlingers',S=localStorage;let W,H,drag=0,aim={},shot=null,objs=[],parts=[],level=1,coins=0,gems=300,score=0,lives=3,hero='lampo',weapon=0,wxp=0,wlv=1,combo=0,skillCd=0,dodgeCd=0,inv=0,ticks=0,kills=0,bosses=0;const heroes=[['lampo','Lampo',3,'Fulmine'],['nova','Nova',3,'Esplosione'],['astra','Astra',4,'Tempesta'],['riven','Riven',4,'Ombra'],['drakon','Drakon',5,'Furia del Drago']].map(a=>({id:a[0],n:a[1],r:a[2],skill:a[3]}));const weapons=[['Spada del Vento','🌪️',1,3,'Combo +5%'],['Arco Solare','☀️',1.2,3,'Crit +3%'],['Daga del Crepuscolo','🌒',1.1,3,'Critico +25%'],['Martello Titanico','🔨',1.6,4,'Stordimento'],['Lancia Stellare','✨',1.35,4,'Boss +10%'],['Falce del Drago','🐉',1.8,5,'Boss +20%'],['Arco del Tuono','⚡',1.55,5,'Area'],['Spada Lunare','🌙',2,5,'Crit +8%'],['Bastone Astrale','🔮',1.45,4,'Skill +15%'],['Pugno Meteora','☄️',1.7,4,'Impatto +12%'],['Katana Cremisi','🩸',1.9,5,'Crit +10%'],['Arco Glaciale','❄️',1.5,4,'Rallenta'],['Ascia Vulcanica','🌋',2.1,5,'Esplosivo'],['Lama del Vuoto','🕳️',2.2,5,'Ignora difesa'],['Corona Celeste','👑',2.4,5,'Bonus +10%']].map(a=>({n:a[0],e:a[1],p:a[2],s:a[3],pass:a[4]}));let mission={shots:0,boss:0,combo:0,claimed:0};function load(){try{let z=JSON.parse(S.getItem(K)||'{}');Object.assign({},{}) ;level=z.level||1;coins=z.coins||0;gems=z.gems??300;score=z.score||0;hero=z.hero||'lampo';weapon=Math.min(z.weapon||0,14);wxp=z.wxp||0;wlv=z.wlv||1;mission=z.mission||mission}catch(e){}}function save(){S.setItem(K,JSON.stringify({level,coins,gems,score,hero,weapon,wxp,wlv,mission}))}function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();load();function ui(){stats.textContent=`❤️ ${lives} 🪙 ${coins} 💎 ${gems} ⭐ ${score}`;lv.textContent=`Lv ${level} · ${weapons[weapon].n} Lv${wlv} · 🔥${combo}`;skill.textContent=skillCd?'⏳':'⚡ '+heroes.find(h=>h.id===hero).skill;dodge.textContent=dodgeCd?'💨 ⏳':'💨 SCHIVATA'}function toast(t){let z=document.getElementById('toast');z.textContent=t;z.classList.add('on');setTimeout(()=>z.classList.remove('on'),1000)}function sling(){return{x:W*.18,y:H*.67}}function newLevel(){objs=[];let b=level%3===0;for(let i=0;i<Math.min(7,2+level/2|0);i++)objs.push({t:'e',x:W*(.5+i*.07),y:H*(.25+(i%3)*.16),hp:1+level*.13});if(b)objs.push({t:'b',x:W*.78,y:H*.34,hp:10+level*2,m:10+level*2,p:1});for(let i=0;i<2;i++)objs.push({t:'q',x:W*(.5+i*.17),y:H*.62,w:65,h:22,hp:2});ui()}function burst(a,b,ch){for(let i=0;i<8;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,l:28,ch})}function addxp(n){wxp+=n;let need=45+wlv*30;while(wxp>=need&&wlv<20){wxp-=need;wlv++;toast('⚔️ Arma Lv '+wlv);need=45+wlv*30}save()}function endShot(){shot=null;drag=0;mission.shots++;setTimeout(()=>{if(objs.some(o=>o.t==='e'||o.t==='b')){lives--;combo=0;if(lives<=0){toast('Game Over');lives=3;level=1;score=0}}else{level++;coins+=5;gems+=25}save();newLevel()},350)}function hit(o,p){if(o.t==='b')return Math.hypot(p.x-o.x,p.y-o.y)<50+p.r;if(o.t==='e')return Math.hypot(p.x-o.x,p.y-o.y)<24+p.r;return p.x>o.x-o.w/2-p.r&&p.x<o.x+o.w/2+p.r&&p.y>o.y-o.h/2-p.r&&p.y<o.y+o.h/2+p.r}function useSkill(){if(skillCd)return;let h=heroes.find(a=>a.id===hero),m=h.r===5?3:h.r===4?2.5:2;objs.filter(o=>o.t==='e'||o.t==='b').forEach(o=>{o.hp-=weapons[weapon].p*m*(weapons[weapon].pass.includes('Skill')?1.15:1);burst(o.x,o.y,'✨')});skillCd=180;mission.combo=Math.max(mission.combo,combo);combo+=2;ui()}function dodge(){if(dodgeCd)return;inv=45;dodgeCd=100;toast('💨 Schivata perfetta!')}play.onclick=()=>{menu.classList.add('hidden');newLevel()};skill.onclick=useSkill;dodge.onclick=dodge;function show(t){sub.classList.remove('hidden');if(t==='missions')content.innerHTML='<h1>🎯 MISSIONI</h1><div class="item"><b>🏹 10 tiri</b><br>'+mission.shots+'/10<button onclick="claim(1)">RICOMPENSA</button></div><div class="item"><b>👹 3 boss</b><br>'+mission.boss+'/3<button onclick="claim(2)">RICOMPENSA</button></div><div class="item"><b>🔥 Combo 10</b><br>'+mission.combo+'/10<button onclick="claim(3)">RICOMPENSA</button></div>';if(t==='heroes')content.innerHTML='<h1>👤 EROI</h1>'+heroes.map(h=>`<div class=item><b>${h.n} · ${'★'.repeat(h.r)}</b><span class=small>${h.skill}</span><br><button onclick="selH('${h.id}')">${hero===h.id?'SELEZIONATO':'USA'}</button></div>`).join('');if(t==='weapons')content.innerHTML='<h1>⚔️ ARMI · 15</h1>'+weapons.map((w,i)=>`<div class=item><b>${w.e} ${w.n} · ${'★'.repeat(w.s)}</b><span class=small>Potenza ${w.p} · ${w.pass}</span><br><button onclick="selW(${i})">USA</button></div>`).join('');if(t==='map')content.innerHTML='<h1>🗺️ CAMPAGNA</h1>'+Array.from({length:30},(_,i)=>`<span style="display:inline-flex;width:45px;height:45px;margin:4px;border-radius:50%;align-items:center;justify-content:center;background:${i+1<=level?'#496b49':'#29375f'}">${i+1}</span>`).join('');if(t==='gacha')content.innerHTML=`<h1>🎲 GACHA</h1><p>💎 ${gems}</p><button onclick="pull(1)">100 💎</button><button onclick="pull(10)">900 💎</button><p class=small>75% ★3 · 20% ★4 · 5% ★5</p><div id=res></div>`}window.selH=id=>{hero=id;save();show('heroes');ui()};window.selW=i=>{weapon=i;wxp=0;wlv=1;save();show('weapons');ui();toast('⚔️ Equipaggiata')};window.claim=n=>{if(mission.claimed&1<<n)return;if((n===1&&mission.shots<10)||(n===2&&mission.boss<3)||(n===3&&mission.combo<10))return toast('Missione non completata');mission.claimed|=1<<n;gems+=n*50;coins+=n*20;save();show('missions');ui();toast('🎁 Ricompensa!')};window.pull=n=>{let cost=n===10?900:100;if(gems<cost)return toast('Gemme insufficienti');gems-=cost;let out=[];for(let j=0;j<n;j++){let r=Math.random()<.05?5:Math.random()<.25?4:3,p=weapons.filter(w=>w.s===r),w=p[Math.random()*p.length|0],i=weapons.indexOf(w);out.push(w.e+' '+w.n+' ★'+w.s);if(j===n-1)weapon=i}res.innerHTML='<div class=item>'+out.join('<br>')+'</div>';save();ui()};heroes.onclick=()=>show('heroes');weapons.onclick=()=>show('weapons');gacha.onclick=()=>show('gacha');map.onclick=()=>show('map');missions.onclick=()=>show('missions');back.onclick=()=>sub.classList.add('hidden');c.onpointerdown=e=>{if(shot)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling();if(Math.hypot(p.x-s.x,p.y-s.y)<100){drag=1;aim=p;c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(!drag)return;let r=c.getBoundingClientRect();aim={x:e.clientX-r.left,y:e.clientY-r.top};let s=sling(),d=Math.min(150,Math.hypot(aim.x-s.x,aim.y-s.y));pow.style.width=d/150*100+'%'};c.onpointerup=e=>{if(!drag)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling(),dx=s.x-p.x,dy=s.y-p.y,d=Math.hypot(dx,dy);drag=0;pow.style.width='0';if(d>12)shot={x:s.x,y:s.y,vx:dx/d*Math.min(d,150)/17,vy:dy/d*Math.min(d,150)/17,r:16}};function update(){if(skillCd)skillCd--;if(dodgeCd)dodgeCd--;if(inv)inv--;if(!shot)return;shot.vy+=.2;shot.x+=shot.vx;shot.y+=shot.vy;for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(hit(o,shot)){let dmg=weapons[weapon].p*(1+Math.min(combo,15)*.04);if(hero==='drakon'&&o.t==='b')dmg*=1.5;if(weapons[weapon].pass.includes('Boss')&&o.t==='b')dmg*=1.1;if(weapons[weapon].pass.includes('Crit')&&Math.random()<.15)dmg*=2;o.hp-=dmg;combo++;score+=o.t==='b'?50:10;coins+=o.t==='b'?20:1;addxp(o.t==='b'?40:7);burst(o.x,o.y,weapons[weapon].e);if(o.hp<=0){if(o.t==='b'){bosses++;mission.boss++;gems+=30+level;toast('🏆 BOSS SCONFITTO!')}else kills++;objs.splice(i,1)}if(Math.hypot(shot.vx,shot.vy)<1.2){endShot();break}}}if(shot&&(shot.x>W+80||shot.y>H+80||shot.x<-80))endShot();let b=objs.find(o=>o.t==='b');if(b){bb.style.display='block';bb.firstElementChild.style.width=Math.max(0,b.hp/b.m*100)+'%';ticks++;if(ticks%100===0&&inv<=0){lives=Math.max(1,lives-1);toast('⚠️ Attacco boss!')}}else bb.style.display='none';mission.combo=Math.max(mission.combo,combo);save();ui()}function draw(){x.clearRect(0,0,W,H);x.fillStyle=level%3===0?'#405d99':level>8?'#28365f':'#54c7ff';x.fillRect(0,0,W,H);x.fillStyle='#70b85a';x.fillRect(0,H*.72,W,H*.28);let s=sling();x.strokeStyle='#633d24';x.lineWidth=9;x.beginPath();x.moveTo(s.x-12,s.y+48);x.lineTo(s.x,s.y);x.lineTo(s.x+18,s.y+48);x.stroke();if(drag){x.strokeStyle='#432719';x.lineWidth=4;x.beginPath();x.moveTo(s.x-3,s.y);x.lineTo(aim.x,aim.y);x.lineTo(s.x+11,s.y);x.stroke()}objs.forEach(o=>{x.save();x.translate(o.x,o.y);if(o.t==='e'){x.fillStyle='#e55353';x.beginPath();x.arc(0,0,20,0,7);x.fill();x.fillStyle='#fff';x.fillRect(-8,-6,6,7);x.fillRect(3,-6,6,7)}else if(o.t==='q'){x.fillStyle='#a96b3c';x.fillRect(-o.w/2,-o.h/2,o.w,o.h)}else{x.fillStyle='#713d91';x.beginPath();x.arc(0,0,46,0,7);x.fill();x.fillStyle='#fff';x.font='bold 17px sans-serif';x.textAlign='center';x.fillText('BOSS',0,6)}x.restore()});parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l--;x.globalAlpha=p.l/28;x.font='18px sans-serif';x.fillText(p.ch,p.x,p.y)});x.globalAlpha=1;if(shot){x.fillStyle='#ffcc33';x.beginPath();x.arc(shot.x,shot.y,shot.r,0,7);x.fill();x.font='20px sans-serif';x.textAlign='center';x.fillText(weapons[weapon].e,shot.x,shot.y+7)}}function loop(){update();draw();requestAnimationFrame(loop)}ui();loop()</script></body></html>
