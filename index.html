4],['Katana Cremisi','🩸',1.9,'Sanguinamento',5],['Arco Glaciale','❄️',1.5,'Gelo',4],['Ascia Vulcanica','🌋',2.1,'Esplosione',5],['Lama del Vuoto','🕳️',2.2,'Vuoto',5],['Corona Celeste','👑',2.4,'Benedizione',5],['Lama Solare','🔥',2,'Brucia',5],['Arco Nebulare','🌌',2.3,'Nebbia',5],['Martello Galattico','💫',2.5,'Onda',5],['Falce Spettrale','👻',2.25,'Spiriti',5],['Lancia del Fulmine','⚡',2.35,'Saetta',5],['Spada Prismatica','🌈',2.55,'Prisma',5],['Arco dell’Aurora','🌅',2.45,'Aurora',5],['Pugno del Titano','🗿',2.7,'Terremoto',5],['Lama Celestiale','🪽',2.8,'Ali',5],['Cuore del Drago','❤️‍🔥',3,'Drago',5]];function save(){localStorage.setItem(K,JSON.stringify({level,coins,gems,score,hero,weapon,wxp,wlv,forge,combo,treasures,kills,shots,pity,frags,owned}))}function load(){try{let d=JSON.parse(localStorage.getItem(K)||'{}');Object.assign(window,d);if(!Array.isArray(owned)||!owned.length)owned=[0];owned=[...new Set(owned.filter(i=>i>=0&&i<Ws.length))];if(!owned.includes(0))owned.unshift(0)}catch(e){}}function resize(){W=c.width=innerWidth;H=c.height=innerHeight;if(!stars.length)for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.8+.3})}addEventListener('resize',resize);resize();load();function tone(f,d=.1,type='sine',v=.05,slide=1){if(!sound||!AC)return;let o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(35,f*slide),n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(AC.destination);o.start();o.stop(n+d+.03)}function audioInit(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(!musicTimer)musicTimer=setInterval(()=>tone(level%3===0?110:220,.15,level%3===0?'sawtooth':'triangle',.018),level%3===0?230:330)}function sfx(n){audioInit();if(n==='gacha'){[392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.07),i*100))}if(n==='rare'){tone(440,.15,'sawtooth',.08,1.8);setTimeout(()=>tone(880,.25,'triangle',.07),90)}if(n==='hit')tone(130,.07,'square',.04,.7);if(n==='boom')tone(70,.3,'sawtooth',.09,.4);if(n==='coin')tone(880,.09,'square',.05,1.3);if(n==='boss')tone(110,.4,'sawtooth',.08,.5);if(n==='skill')tone(440,.25,'triangle',.07,2);if(n==='win')[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.06),i*100))}function ui(){stats.textContent=`❤️${lives} 🪙${coins} 💎${gems} 🔷${frags}`;lv.textContent=`Lv${level}/60 · ${Ws[weapon][0]} · 🔥${combo}`}function toast(a){let z=document.getElementById('toast');z.textContent=a;z.classList.add('on');setTimeout(()=>z.classList.remove('on'),1200)}function burst(a,b,ch,n=16){for(let i=0;i<n;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:30,ch})}function newLevel(){objs=[];combo=0;let n=Math.min(10,2+Math.floor(level/3));for(let i=0;i<n;i++)objs.push({t:i%5===4?'f':'e',x:W*(.47+i*.05),y:H*(.22+(i%4)*.13),hp:(1+level*.17)*(i%4===3?2.1:1),elite:i%4===3&&level>4});if(level%3===0)objs.push({t:'b',x:W*.78,y:H*.34,hp:18+level*3,m:18+level*3});if(level%5===0)objs.push({t:'q',x:W*.63,y:H*.57,hp:1});if(level%3===0){sfx('boss');toast('👑 BOSS!')}ui()}function nearestTarget(){let alive=objs.filter(o=>o.hp>0&&o.t!=='q');return alive.sort((a,b)=>Math.hypot(a.x-W*.18,a.y-H*.67)-Math.hypot(b.x-W*.18,b.y-H*.67))[0]}function damage(o){if(!o||o.hp<=0)return;let d=Ws[weapon][2]*(1+forge*.04)*(1+Hs[hero][1]*.06)*(1+wlv*.035);if(Math.random()<.12){d*=1.8;sfx('rare');toast('💥 CRITICO!')}else sfx('hit');o.hp-=d;combo++;score+=Math.ceil(d);if(o.hp<=0){kills++;wxp+=10;coins+=3;burst(o.x,o.y,'💥',18);sfx('boom');if(wxp>=wlv*40&&wlv<30){wxp-=wlv*40;wlv++;toast('⬆️ ARMA LV '+wlv)}}ui();save();setTimeout(check,120)}function collectTreasure(o){if(!o||o.hp>0)return;o.hp=-1;treasures++;gems+=30;coins+=20;burst(o.x,o.y,'💎',24);sfx('coin');toast('🎁 +30💎 +20🪙');save();setTimeout(check,120)}function check(){if(objs.some(o=>o.hp>0))return;if(level<60){level++;coins+=10;gems+=20;sfx('win');save();newLevel()}else{gems+=100;sfx('win');toast('🏆 CAMPAGNA COMPLETATA!');save()}}function gachaOne(){if(gems<100)return null;gems-=100;pity++;let guaranteed=pity>=10,r=Math.random(),rar=guaranteed?4:(r<.05?5:r<.25?4:3),pool=Ws.filter(w=>w[4]>=rar),w=pool[Math.floor(Math.random()*pool.length)]||Ws[0],idx=Ws.indexOf(w),duplicate=owned.includes(idx);if(guaranteed)pity=0;if(duplicate){frags+=w[4]*5;coins+=20;sfx('coin')}else{owned.push(idx);weapon=idx;sfx(rar>=5?'rare':'gacha')}save();return{w,idx,rar,duplicate}}function gacha(n){let cost=n===10?900:100;if(gems<cost){toast('💎 Ti servono '+cost+' gemme');return}let res=[];if(n===10){gems-=900;for(let i=0;i<10;i++){let old=gems;let r=pity+1,guaranteed=r>=10,roll=Math.random(),rar=guaranteed?4:(roll<.05?5:roll<.25?4:3),pool=Ws.filter(w=>w[4]>=rar),w=pool[Math.floor(Math.random()*pool.length)]||Ws[0],idx=Ws.indexOf(w),dup=owned.includes(idx);pity=guaranteed?0:pity+1;if(dup){frags+=w[4]*5;coins+=20}else{owned.push(idx);weapon=idx}res.push({w,idx,rar,duplicate:dup})}sfx('gacha')}else{res=[gachaOne()];if(res[0]&&res[0].rar>=5)sfx('rare')}save();openMenu('GACHA',`<p>Spesa: <b>${cost} 💎</b></p>${res.map(r=>`<div class=item><span class=rar>${'⭐'.repeat(r.rar)}</span> ${r.w[1]} <b>${r.w[0]}</b><br><span class=small>${r.duplicate?'Doppione → +'+r.w[4]*5+' 🔷':'NUOVA ARMA · aggiunta alla collezione'}</span></div>`).join('')}<p>💎 ${gems} · 🔷 ${frags} · Pity ${pity}/10 · Armi ${owned.length}/25</p>`)}function openMenu(t,h){menu.classList.add('hidden');sub.classList.remove('hidden');content.innerHTML='<h2>'+t+'</h2>'+h}function closeMenu(){sub.classList.add('hidden');menu.classList.remove('hidden');ui()}function skillUse(){if(skillCd)return;skillCd=1;sfx('skill');objs.forEach(o=>{if(o.t!=='q')o.hp=0});burst(W*.72,H*.35,'⚡',30);setTimeout(()=>skillCd=0,3500);check()}function dodgeUse(){if(dodgeCd)return;dodgeCd=1;inv=60;toast('💨 SCHIVATA!');setTimeout(()=>dodgeCd=0,3000)}function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#08193d');g.addColorStop(1,'#2573a1');x.fillStyle=g;x.fillRect(0,0,W,H);stars.forEach(s=>{x.globalAlpha=.5;x.fillStyle='#fff';x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,7);x.fill()});x.globalAlpha=1;x.fillStyle='#173b4d';x.fillRect(0,H*.78,W,H*.22);objs.forEach(o=>{if(o.hp<=0)return;x.save();x.translate(o.x,o.y);if(o.t==='b'){x.font='58px serif';x.fillText('👑',-30,20);bb.style.display='block';bb.querySelector('i').style.width=Math.max(0,100*o.hp/o.m)+'%'}else if(o.t==='q'){x.font='42px serif';x.fillText('🎁',-21,15)}else{x.font=o.elite?'42px serif':'34px serif';x.fillText(o.t==='f'?'👾':'👹',-20,12);if(o.elite){x.font='18px serif';x.fillText('⭐',-9,-24)}}x.restore()});let sx=W*.18,sy=H*.67;x.strokeStyle='#e7c48a';x.lineWidth=6;x.beginPath();x.moveTo(sx-16,sy-20);x.lineTo(sx,sy);x.lineTo(sx+16,sy-20);x.stroke();if(shot){x.strokeStyle='#ffffff88';x.lineWidth=3;x.beginPath();x.moveTo(sx,sy);x.lineTo(shot.x,shot.y);x.stroke();x.fillStyle='#ffe66b';x.beginPath();x.arc(shot.x,shot.y,9,0,7);x.fill()}parts.forEach(p=>{x.globalAlpha=p.l/30;x.font='16px serif';x.fillText(p.ch,p.x,p.y)});x.globalAlpha=1;ui()}function update(){parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l--});parts=parts.filter(p=>p.l>0);if(shot&&shot.flying){shot.x+=shot.vx;shot.y+=shot.vy;shot.vy+=.35;for(let o of objs){if(o.hp>0&&Math.hypot(shot.x-o.x,shot.y-o.y)<42){if(o.t==='q')collectTreasure(o);else damage(o);shot=null;drag=0;break}}if(shot&&(shot.x>W||shot.y>H||shot.y<0)){shot=null;drag=0;setTimeout(check,120)}}}function loop(){update();draw();requestAnimationFrame(loop)}play.onclick=()=>{audioInit();menu.classList.add('hidden');lives=3;newLevel()};audio.onclick=()=>{sound=!sound;audio.textContent=sound?'🔊 AUDIO':'🔇 AUDIO';if(!sound&&musicTimer){clearInterval(musicTimer);musicTimer=null}else audioInit()};skill.onclick=skillUse;dodge.onclick=dodgeUse;back.onclick=closeMenu;heroes.onclick=()=>openMenu('EROI',Hs.map((h,i)=>`<button onclick="hero=${i};save();closeMenu()">${h[0]} · ${h[2]} ⭐${h[1]}</button>`).join(''));weapons.onclick=()=>openMenu('ARMI',Ws.map((w,i)=>`<button ${owned.includes(i)?'':'disabled'} onclick="weapon=${i};save();closeMenu()">${w[1]} ${w[0]} · ${w[3]} · ⭐${w[4]} ${owned.includes(i)?'':'🔒'}</button>`).join(''));gacha.onclick=()=>openMenu('GACHA',`<p>💎 <b>${gems}</b> gemme · 🔷 ${frags} frammenti</p><p>1 estrazione = <b>100 💎</b><br>10 estrazioni = <b>900 💎</b></p><button onclick="gacha(1)">✨ 1 ESTRAZIONE</button><button onclick="gacha(10)">🌟 10 ESTRAZIONI</button><p>🎯 Pity: ${pity}/10 · alla 10ª è garantita almeno una 4★.</p><p>📦 Collezione: ${owned.length}/25 armi.</p>`);map.onclick=()=>openMenu('MAPPA',`<p>Capitolo ${Math.ceil(level/10)} · Livello ${level}/60</p><p>Progresso: ${Math.round(level/60*100)}%</p>`);forge.onclick=()=>{let cost=100*(forge+1);if(coins>=cost){coins-=cost;forge++;sfx('coin');save();toast('🔨 FORGIA +1')}openMenu('FORGIA',`<p>Forgia Lv ${forge}</p><p>Danno +${forge*4}%</p><p>Costo prossimo: ${cost} 🪙</p>`)};missions.onclick=()=>openMenu('MISSIONI',`<p>👹 Nemici: ${kills}</p><p>🎁 Tesori raccolti: ${treasures}</p><p>🏹 Lanci: ${shots}</p><p>💎 Gemme guadagnate completando i livelli: +20.</p>`);shop.onclick=()=>openMenu('NEGOZIO',`<p>🪙 ${coins} · 💎 ${gems}</p><button onclick="if(coins>=100){coins-=100;gems+=50;save();toast('💎 +50');closeMenu()}">100 🪙 → 50 💎</button>`);addEventListener('pointerdown',e=>{if(menu.classList.contains('hidden')&&sub.classList.contains('hidden')){let sx=W*.18,sy=H*.67;if(Math.hypot(e.clientX-sx,e.clientY-sy)<70){drag=1;shot={x:sx,y:sy,vx:0,vy:0,flying:false}}}});addEventListener('pointermove',e=>{if(drag&&shot){shot.x=e.clientX;shot.y=e.clientY;pow.style.width=Math.min(100,Math.hypot(shot.x-W*.18,shot.y-H*.67)/2)+'%'}});addEventListener('pointerup',e=>{if(!drag||!shot)return;let sx=W*.18,sy=H*.67,dx=sx-e.clientX,dy=sy-e.clientY;shot={x:sx,y:sy,vx:dx*.085,vy:dy*.085,flying:true};drag=0;shots++;pow.style.width='0%';sfx('gacha');save()});loop();</script></body></html>
