<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sky Slingers V61</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071329;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}button{border:0;border-radius:16px;padding:11px 14px;margin:4px;font-weight:900;color:#fff;background:linear-gradient(135deg,#5b7cff,#7a4dff);box-shadow:0 6px 18px #0005;transition:.15s}button:active{transform:scale(.95)}.dark{background:linear-gradient(135deg,#172847,#263c67);border:1px solid #ffffff20}.hud{position:fixed;top:7px;left:0;right:0;display:flex;justify-content:space-between;padding:7px 9px;z-index:3;pointer-events:none}.pill{background:#07152ce8;border:1px solid #ffffff25;border-radius:18px;padding:9px 12px;box-shadow:0 8px 25px #0005;backdrop-filter:blur(10px);font-size:12px;font-weight:800}.panel{position:fixed;inset:0;background:linear-gradient(#071329ee,#0b1630f7);display:flex;align-items:center;justify-content:center;z-index:6}.card{width:min(94vw,560px);max-height:91vh;overflow:auto;text-align:center;padding:22px;border-radius:28px;background:linear-gradient(160deg,#15284eeF,#0b1730f5);border:1px solid #ffffff22;box-shadow:0 20px 60px #0008;backdrop-filter:blur(16px)}.card h1{font-size:34px;margin:4px 0 8px;text-shadow:0 5px 20px #4e7dff88}.hidden{display:none!important}.item{background:linear-gradient(135deg,#1a3158,#122443);border:1px solid #ffffff12;border-radius:16px;padding:10px;margin:6px;text-align:left;box-shadow:0 5px 15px #0003}.small{font-size:12px;opacity:.7}.skill,.dodge{position:fixed;bottom:17px;z-index:4}.skill{right:7px}.dodge{left:7px}.power{position:fixed;left:28%;bottom:28px;width:44%;height:11px;background:#06101eaa;border:1px solid #ffffff22;border-radius:99px;overflow:hidden;z-index:4}.power i{display:block;height:100%;background:linear-gradient(90deg,#5cf,#b5f,#fff);width:0;box-shadow:0 0 14px #9cf}.boss{position:fixed;left:10%;right:10%;top:59px;height:15px;background:#08101dcc;border:1px solid #ffffff22;border-radius:99px;display:none;overflow:hidden;z-index:3}.boss i{display:block;height:100%;background:linear-gradient(90deg,#ff3860,#ff8a3d);box-shadow:0 0 15px #f44}.toast{position:fixed;top:20%;left:50%;transform:translateX(-50%) scale(.9);background:#08152bea;border:1px solid #ffffff25;padding:11px 17px;border-radius:16px;opacity:0;z-index:9;box-shadow:0 12px 30px #0008;transition:.2s}.toast.on{opacity:1;transform:translateX(-50%) scale(1)}</style></head><body><canvas id=c></canvas><div class=hud><div class=pill id=stats></div><div class=pill id=lv></div></div><div class=boss id=bb><i></i></div><div class=power><i id=pow></i></div><button class=skill id=skill>⚡ ABILITÀ</button><button class=dodge id=dodge>💨 SCHIVATA</button><div id=toast class=toast></div><div id=menu class=panel><div class=card><h1>☁️ SKY SLINGERS</h1><p>✨ V61 · 60 livelli · 25 armi · 8 eroi</p><button id=play>🚀 GIOCA</button><button class=dark id=heroes>👤 EROI</button><button class=dark id=weapons>⚔️ ARMI</button><button class=dark id=gacha>🎲 GACHA</button><button class=dark id=map>🗺️ MAPPA</button><button class=dark id=forge>🔨 FORGIA</button><button class=dark id=missions>🎯 MISSIONI</button><button class=dark id=ach>🏆 OBIETTIVI</button><button class=dark id=shop>🛒 NEGOZIO</button><p class=small>Nuovo stile: cielo dinamico, profondità, luci, particelle, UI glass e combattimenti più spettacolari.</p></div></div><div id=sub class="panel hidden"><div class=card><div id=content></div><button class=dark id=back>INDIETRO</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),S=localStorage,K='skySlingers60';let W,H,drag=0,shot=null,objs=[],parts=[],stars=[],level=1,coins=500,gems=300,score=0,lives=3,hero=0,weapon=0,wxp=0,wlv=1,combo=0,skillCd=0,dodgeCd=0,inv=0,t=0,forge=0,treasures=0,kills=0,bosses=0,shots=0;const Hs=[['Lampo',3,'Fulmine'],['Nova',3,'Esplosione'],['Astra',4,'Tempesta'],['Riven',4,'Ombra'],['Drakon',5,'Furia del Drago'],['Lyra',4,'Luna'],['Kairo',5,'Raggio Cosmico'],['Vega',5,'Supernova']];const Ws=[['Spada del Vento','🌪️',1,3],['Arco Solare','☀️',1.2,3],['Daga del Crepuscolo','🌒',1.1,3],['Martello Titanico','🔨',1.6,4],['Lancia Stellare','✨',1.35,4],['Falce del Drago','🐉',1.8,5],['Arco del Tuono','⚡',1.55,5],['Spada Lunare','🌙',2,5],['Bastone Astrale','🔮',1.45,4],['Pugno Meteora','☄️',1.7,4],['Katana Cremisi','🩸',1.9,5],['Arco Glaciale','❄️',1.5,4],['Ascia Vulcanica','🌋',2.1,5],['Lama del Vuoto','🕳️',2.2,5],['Corona Celeste','👑',2.4,5],['Lama Solare','🔥',2,5],['Arco Nebulare','🌌',2.3,5],['Martello Galattico','💫',2.5,5],['Falce Spettrale','👻',2.25,5],['Lancia del Fulmine','⚡',2.35,5],['Spada Prismatica','🌈',2.55,5],['Arco dell’Aurora','🌅',2.45,5],['Pugno del Titano','🗿',2.7,5],['Lama Celestiale','🪽',2.8,5],['Cuore del Drago','❤️‍🔥',3,5]];function load(){try{let z=JSON.parse(S.getItem(K)||'{}');Object.assign(window,{level:z.level||1,coins:z.coins??500,gems:z.gems??300,score:z.score||0,hero:z.hero||0,weapon:Math.min(z.weapon||0,24),wxp:z.wxp||0,wlv:z.wlv||1,forge:z.forge||0,treasures:z.treasures||0,kills:z.kills||0,bosses:z.bosses||0,shots:z.shots||0})}catch(e){}}function save(){S.setItem(K,JSON.stringify({level,coins,gems,score,hero,weapon,wxp,wlv,forge,treasures,kills,bosses,shots}))}function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H*.72,r:Math.random()*1.8+.3,a:Math.random()}))}addEventListener('resize',resize);resize();load();function ui(){stats.textContent=`❤️ ${lives}   🪙 ${coins}   💎 ${gems}   ⭐ ${score}`;lv.textContent=`LV ${level}/60 · ${Ws[weapon][0]} +${forge} · 🔥 ${combo}`}function toast(a){let z=document.getElementById('toast');z.textContent=a;z.classList.add('on');setTimeout(()=>z.classList.remove('on'),1000)}function sling(){return{x:W*.18,y:H*.67}}function chapter(){return Math.ceil(level/10)}function newLevel(){objs=[];let n=Math.min(10,2+Math.floor(level/3));for(let i=0;i<n;i++)objs.push({t:'e',x:W*(.47+i*.052),y:H*(.22+(i%4)*.13),hp:(1+level*.17)*(i%4===3?2.1:1),elite:i%4===3&&level>4,seed:Math.random()*9});if(level%3===0)objs.push({t:'b',x:W*.78,y:H*.34,hp:18+level*3,m:18+level*3,phase:1});if(level%5===0)objs.push({t:'q',x:W*.63,y:H*.57,w:70,h:28,hp:2});ui();toast(`CAPITOLO ${chapter()}  ·  LIVELLO ${level}`)}function burst(a,b,ch){for(let i=0;i<16;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:34,ch})}function xp(n){wxp+=n;let need=40+wlv*32;while(wxp>=need&&wlv<30){wxp-=need;wlv++;coins+=10;toast('⚔️ ARMA LIV '+wlv);need=40+wlv*32}save()}function finish(){shot=null;drag=0;setTimeout(()=>{if(objs.some(o=>o.t==='e'||o.t==='b')){lives--;combo=0;if(lives<=0){lives=3;level=Math.max(1,level-2);toast('💥 SCONFITTA · -2 LIVELLI')}}else{if(level<60){level++;coins+=10;gems+=20}else{toast('🏆 CAMPAGNA COMPLETATA!');gems+=100}}save();newLevel()},300)}function hit(o,p){if(o.t==='b')return Math.hypot(p.x-o.x,p.y-o.y)<50+p.r;if(o.t==='e')return Math.hypot(p.x-o.x,p.y-o.y)<(o.elite?30:24)+p.r;return p.x>o.x-o.w/2-p.r&&p.x<o.x+o.w/2+p.r&&p.y>o.y-o.h/2-p.r&&p.y<o.y+o.h/2+p.r}function skillUse(){if(skillCd)return;let mult=Hs[hero][1]===5?3.2:Hs[hero][1]===4?2.6:2.1;objs.filter(o=>o.t==='e'||o.t==='b').forEach(o=>{o.hp-=Ws[weapon][2]*mult*(1+forge*.05);burst(o.x,o.y,'✨')});skillCd=170;combo+=2;ui()}function dodgeUse(){if(dodgeCd)return;inv=50;dodgeCd=105;toast('💨 SCHIVATA PERFETTA')}play.onclick=()=>{menu.classList.add('hidden');newLevel()};skill.onclick=skillUse;dodge.onclick=dodgeUse;function show(q){sub.classList.remove('hidden');if(q==='heroes')content.innerHTML='<h1>👤 EROI</h1>'+Hs.map((h,i)=>`<div class=item><b>${h[0]} · ${'★'.repeat(h[1])}</b><span class=small>${h[2]}</span><br><button onclick="sh(${i})">${hero===i?'SELEZIONATO':'USA'}</button></div>`).join('');if(q==='weapons')content.innerHTML='<h1>⚔️ ARMI · 25</h1>'+Ws.map((w,i)=>`<div class=item><b>${w[1]} ${w[0]} · ${'★'.repeat(w[3])}</b><span class=small>Potenza ${w[2].toFixed(2)} · Livello ${i+1}</span><br><button onclick="sw(${i})">USA</button></div>`).join('');if(q==='map')content.innerHTML='<h1>🗺️ MAPPA · 60</h1>'+Array.from({length:60},(_,i)=>`<span style="display:inline-flex;width:42px;height:42px;margin:3px;border-radius:50%;align-items:center;justify-content:center;background:${i+1<=level?'#355fa3':'#182b4e'};box-shadow:inset 0 0 0 1px #ffffff18">${i+1}</span>`).join('');if(q==='forge')content.innerHTML=`<h1>🔨 FORGIA</h1><p>${Ws[weapon][1]} ${Ws[weapon][0]}</p><p>Forgia +${forge} · danno +${forge*5}%</p><button onclick="up()">POTENZIA · ${150*(forge+1)} 🪙</button>`;if(q==='gacha')content.innerHTML=`<h1>🎲 GACHA</h1><p>💎 ${gems}</p><button onclick="pull(1)">100 💎</button><button onclick="pull(10)">900 💎</button><p class=small>75% ★3 · 20% ★4 · 5% ★5</p><div id=res></div>`;if(q==='missions')content.innerHTML=`<h1>🎯 MISSIONI</h1><div class=item>Colpisci 20 nemici · ${kills%20}/20<br><button onclick="claim(20)">RISCATTA 50 💎</button></div><div class=item>Sconfiggi 3 boss · ${bosses%3}/3<br><button onclick="claim(30)">RISCATTA 100 💎</button></div><div class=item>Effettua 50 tiri · ${shots%50}/50<br><button onclick="claim(10)">RISCATTA 75 💎</button></div>`;if(q==='ach')content.innerHTML=`<h1>🏆 OBIETTIVI</h1><div class=item>⚔️ Cacciatore · ${kills} eliminazioni</div><div class=item>👑 Re dei Boss · ${bosses} boss</div><div class=item>🎁 Tesori · ${treasures}</div><div class=item>🌟 Progresso · livello ${level}/60</div>`;if(q==='shop')content.innerHTML=`<h1>🛒 NEGOZIO</h1><div class=item>💎 100 gemme → 500 🪙<br><button onclick="buy(100)">COMPRA</button></div><div class=item>❤️ +1 vita → 150 🪙<br><button onclick="buyLife()">COMPRA</button></div>`}window.sh=i=>{hero=i;save();show('heroes')};window.sw=i=>{weapon=i;wxp=0;wlv=1;forge=0;save();show('weapons');toast('⚔️ '+Ws[i][0])};window.up=()=>{let cost=150*(forge+1);if(coins<cost)return toast('MONETE INSUFFICIENTI');coins-=cost;forge++;save();show('forge');ui()};window.pull=n=>{let cost=n===10?900:100;if(gems<cost)return toast('GEMME INSUFFICIENTI');gems-=cost;let out=[];for(let j=0;j<n;j++){let r=Math.random()<.05?5:Math.random()<.25?4:3,a=Ws.filter(w=>w[3]===r),w=a[Math.random()*a.length|0];weapon=Ws.indexOf(w);out.push(w[1]+' '+w[0]+' ★'+w[3])}document.getElementById('res').innerHTML='<div class=item>'+out.join('<br>')+'</div>';save();ui()};window.claim=n=>{gems+=n;save();show('missions');toast('🎁 RICOMPENSA!')};window.buy=n=>{if(gems<100)return toast('GEMME INSUFFICIENTI');gems-=100;coins+=500;save();show('shop');ui()};window.buyLife=()=>{if(coins<150)return toast('MONETE INSUFFICIENTI');coins-=150;lives++;save();show('shop');ui()};heroes.onclick=()=>show('heroes');weapons.onclick=()=>show('weapons');gacha.onclick=()=>show('gacha');map.onclick=()=>show('map');forge.onclick=()=>show('forge');missions.onclick=()=>show('missions');ach.onclick=()=>show('ach');shop.onclick=()=>show('shop');back.onclick=()=>sub.classList.add('hidden');c.onpointerdown=e=>{if(shot)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling();if(Math.hypot(p.x-s.x,p.y-s.y)<105){drag=1;c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(!drag)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling(),d=Math.min(160,Math.hypot(p.x-s.x,p.y-s.y));pow.style.width=d/160*100+'%'};c.onpointerup=e=>{if(!drag)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling(),dx=s.x-p.x,dy=s.y-p.y,d=Math.hypot(dx,dy);drag=0;pow.style.width=0;if(d>12){shot={x:s.x,y:s.y,vx:dx/d*Math.min(d,160)/17,vy:dy/d*Math.min(d,160)/17,r:16};shots++;save()}};function update(){if(skillCd)skillCd--;if(dodgeCd)dodgeCd--;if(inv)inv--;if(!shot)return;shot.vy+=.2;shot.x+=shot.vx;shot.y+=shot.vy;for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(hit(o,shot)){let dmg=Ws[weapon][2]*(1+Math.min(combo,18)*.035)*(1+forge*.05)*(1+(wlv-1)*.015);if(o.elite)dmg*=.78;if(hero===4&&o.t==='b')dmg*=1.5;if(Math.random()<.08){dmg*=2;toast('💥 CRIT!')}o.hp-=dmg;combo++;kills+=o.t==='e'?1:0;score+=o.t==='b'?70:o.elite?30:10;coins+=o.t==='b'?30:o.elite?5:1;xp(o.t==='b'?50:8);burst(o.x,o.y,Ws[weapon][1]);if(o.hp<=0){if(o.t==='b'){gems+=35+level;bosses++;toast('🏆 BOSS SCONFITTO!')}if(o.t==='q'){treasures++;gems+=100;coins+=60;toast('🎁 TESORO RARO!')}objs.splice(i,1)}if(Math.hypot(shot.vx,shot.vy)<1.3){finish();break}}}if(shot&&(shot.x>W+90||shot.y>H+90||shot.x<-90))finish();let b=objs.find(o=>o.t==='b');if(b){bb.style.display='block';bb.firstElementChild.style.width=Math.max(0,b.hp/b.m*100)+'%';t++;if(t%95===0&&inv<=0){lives=Math.max(1,lives-1);toast('⚠️ ATTACCO BOSS!')}}else bb.style.display='none';ui()}function sky(){let g=x.createLinearGradient(0,0,0,H);let a=level%10===0?'#20153f':level%3===0?'#183b68':level>30?'#102b4b':'#168cc4';g.addColorStop(0,'#050d20');g.addColorStop(.48,a);g.addColorStop(1,'#64d5e8');x.fillStyle=g;x.fillRect(0,0,W,H);stars.forEach(s=>{x.globalAlpha=.35+s.a*.65;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r*(.7+.3*Math.sin(t*.02+s.x)),0,7);x.fill()});x.globalAlpha=1;for(let j=0;j<4;j++){let cy=H*(.18+j*.14)+Math.sin(t*.008+j)*8;for(let i=0;i<4;i++){let cx=((i*W*.32+t*(j+1)*.12)% (W+180))-90;x.fillStyle=j%2?'#ffffff16':'#bcefff18';x.beginPath();x.ellipse(cx+i*35,cy,70,22,0,0,7);x.fill()}}let gr=x.createLinearGradient(0,H*.68,0,H);gr.addColorStop(0,'#3d9b62');gr.addColorStop(1,'#143d38');x.fillStyle=gr;x.fillRect(0,H*.72,W,H*.28)}function draw(){x.clearRect(0,0,W,H);sky();let s=sling();x.save();x.shadowBlur=22;x.shadowColor='#66d9ff88';x.fillStyle='#183d5b';x.beginPath();x.ellipse(s.x,s.y+43,55,18,0,0,7);x.fill();x.restore();x.strokeStyle='#8b5a32';x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(s.x-15,s.y+48);x.lineTo(s.x,s.y);x.lineTo(s.x+19,s.y+48);x.stroke();if(drag){x.strokeStyle='#f7d88a';x.lineWidth=4;x.beginPath();x.moveTo(s.x-2,s.y);x.lineTo(s.x+(W*.18-(pow.offsetWidth/100)*160),s.y);x.stroke()}objs.forEach(o=>{x.save();x.translate(o.x,o.y+Math.sin(t*.04+o.seed)*3);if(o.t==='e'){let r=o.elite?28:21;let g=x.createRadialGradient(-7,-8,2,0,0,r);g.addColorStop(0,'#ffb0a0');g.addColorStop(1,o.elite?'#ff7a25':'#d93652');x.fillStyle=g;x.shadowBlur=18;x.shadowColor=o.elite?'#ff8a3088':'#ff405588';x.beginPath();x.arc(0,0,r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.beginPath();x.arc(-7,-4,5,0,7);x.arc(7,-4,5,0,7);x.fill();x.fillStyle='#14213b';x.beginPath();x.arc(-7,-4,2,0,7);x.arc(7,-4,2,0,7);x.fill();if(o.elite){x.fillStyle='#ffd447';x.font='bold 18px sans-serif';x.textAlign='center';x.fillText('★',0,-35)}}else if(o.t==='q'){x.shadowBlur=20;x.shadowColor='#7af';x.fillStyle='#a879ff';x.rotate(Math.PI/4);x.fillRect(-23,-23,46,46);x.rotate(-Math.PI/4);x.shadowBlur=0;x.fillStyle='#dff';x.font='bold 20px sans-serif';x.textAlign='center';x.fillText('💎',0,8)}else{let g=x.createRadialGradient(-12,-14,3,0,0,50);g.addColorStop(0,'#d49cff');g.addColorStop(1,'#51218c');x.fillStyle=g;x.shadowBlur=28;x.shadowColor='#9b5cff99';x.beginPath();x.arc(0,0,48,0,7);x.fill();x.shadowBlur=0;x.strokeStyle='#ffffff55';x.lineWidth=3;x.stroke();x.fillStyle='#fff';x.font='bold 16px sans-serif';x.textAlign='center';x.fillText('BOSS',0,6)}x.restore()});parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l--;x.globalAlpha=p.l/34;x.font='19px sans-serif';x.fillText(p.ch,p.x,p.y)});x.globalAlpha=1;if(shot){x.save();x.shadowBlur=25;x.shadowColor='#ffe66d';let g=x.createRadialGradient(shot.x-5,shot.y-5,2,shot.x,shot.y,shot.r);g.addColorStop(0,'#fff');g.addColorStop(.35,'#ffe66d');g.addColorStop(1,'#ff8c28');x.fillStyle=g;x.beginPath();x.arc(shot.x,shot.y,shot.r,0,7);x.fill();x.restore();x.font='22px sans-serif';x.textAlign='center';x.fillText(Ws[weapon][1],shot.x,shot.y+8)}}function loop(){update();draw();requestAnimationFrame(loop)}ui();loop()</script></body></html>
