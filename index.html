<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sky Slingers V65</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071126;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}button{border:1px solid #ffffff26;border-radius:16px;padding:11px 15px;margin:4px;font-weight:900;color:#fff;background:linear-gradient(180deg,#526da8,#30456f);box-shadow:0 5px 16px #0006}button:active{transform:scale(.96)}.dark{background:#172643}.hud{position:fixed;top:7px;left:0;right:0;display:flex;justify-content:space-between;padding:7px;z-index:3;pointer-events:none}.pill{background:#101b35d9;border:1px solid #ffffff24;border-radius:18px;padding:9px 11px;box-shadow:0 5px 18px #0005;backdrop-filter:blur(8px)}.panel{position:fixed;inset:0;background:#050b18e8;display:flex;align-items:center;justify-content:center;z-index:6}.card{width:min(94vw,560px);max-height:91vh;overflow:auto;text-align:center;background:linear-gradient(145deg,#172747f5,#0c1830f5);border:1px solid #ffffff25;border-radius:28px;padding:20px;box-shadow:0 20px 70px #000b}.hidden{display:none!important}.item{background:linear-gradient(135deg,#263a64,#172744);border:1px solid #ffffff14;border-radius:16px;padding:10px;margin:6px;text-align:left}.small{font-size:12px;opacity:.72}.skill,.dodge,.ult{position:fixed;bottom:17px;z-index:4}.skill{right:7px}.dodge{left:7px}.ult{left:50%;transform:translateX(-50%);bottom:62px}.power{position:fixed;left:27%;bottom:30px;width:46%;height:11px;background:#08101fcc;border:1px solid #ffffff22;border-radius:20px;overflow:hidden;z-index:4}.power i{display:block;height:100%;background:linear-gradient(90deg,#61d8ff,#fff36b);width:0}.boss{position:fixed;left:10%;right:10%;top:59px;height:15px;background:#080b13dd;border:1px solid #ffffff22;border-radius:20px;display:none;z-index:3;overflow:hidden}.boss i{display:block;height:100%;background:linear-gradient(90deg,#ff315f,#ff9b5c)}.toast{position:fixed;top:20%;left:50%;transform:translate(-50%,-10px);background:#101b35ef;border:1px solid #ffffff22;padding:11px 16px;border-radius:18px;opacity:0;z-index:9;transition:.18s}.toast.on{opacity:1;transform:translate(-50%,0)}</style><body><canvas id=c></canvas><div class=hud><div class=pill id=stats></div><div class=pill id=lv></div></div><div class=boss id=bb><i></i></div><div class=power><i id=pow></i></div><button class=skill id=skill>⚡ ABILITÀ</button><button class=dodge id=dodge>💨 SCHIVATA</button><button class=ult id=ult>🌟 ULTIMATE</button><div id=toast class=toast></div><div id=menu class=panel><div class=card><div style="font-size:58px">☁️</div><h1>Sky Slingers</h1><p>V65 · 60 livelli · 25 armi · ultimate eroi</p><button id=play>🚀 GIOCA</button><button class=dark id=heroes>EROI</button><button class=dark id=weapons>ARMI</button><button class=dark id=gacha>GACHA</button><button class=dark id=map>MAPPA</button><button class=dark id=forge>FORGIA</button><button class=dark id=missions>MISSIONI</button><button class=dark id=ach>OBIETTIVI</button><button class=dark id=shop>NEGOZIO</button><p class=small>V65: ultimate personalizzate, attacchi nemici visibili e tesori che richiedono davvero un colpo.</p></div></div><div id=sub class="panel hidden"><div class=card><div id=content></div><button class=dark id=back>INDIETRO</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),S=localStorage,K='skySlingers60';let W,H,drag=0,shot=null,objs=[],parts=[],stars=[],level=1,coins=500,gems=300,score=0,lives=3,hero=0,weapon=0,wxp=0,wlv=1,combo=0,skillCd=0,dodgeCd=0,ultCd=0,inv=0,t=0,forge=0,treasures=0,kills=0,bosses=0,shots=0,shake=0;const Hs=[['Lampo',3,'Fulmine','⚡'],['Nova',3,'Esplosione','💥'],['Astra',4,'Tempesta','🌪️'],['Riven',4,'Ombra','🌑'],['Drakon',5,'Furia del Drago','🐉'],['Lyra',4,'Luna','🌙'],['Kairo',5,'Raggio Cosmico','☄️'],['Vega',5,'Supernova','🌟']];const Ws=[['Spada del Vento','🌪️',1,'Turbine'],['Arco Solare','☀️',1.2,'Raggio'],['Daga del Crepuscolo','🌒',1.1,'Ombra'],['Martello Titanico','🔨',1.6,'Stordisci'],['Lancia Stellare','✨',1.35,'Stella'],['Falce del Drago','🐉',1.8,'Fiamma'],['Arco del Tuono','⚡',1.55,'Catena'],['Spada Lunare','🌙',2,'Luna'],['Bastone Astrale','🔮',1.45,'Nova'],['Pugno Meteora','☄️',1.7,'Meteora'],['Katana Cremisi','🩸',1.9,'Sanguinamento'],['Arco Glaciale','❄️',1.5,'Gelo'],['Ascia Vulcanica','🌋',2.1,'Esplosione'],['Lama del Vuoto','🕳️',2.2,'Vuoto'],['Corona Celeste','👑',2.4,'Benedizione'],['Lama Solare','🔥',2,'Brucia'],['Arco Nebulare','🌌',2.3,'Nebbia'],['Martello Galattico','💫',2.5,'Onda'],['Falce Spettrale','👻',2.25,'Spiriti'],['Lancia del Fulmine','⚡',2.35,'Saetta'],['Spada Prismatica','🌈',2.55,'Prisma'],['Arco dell’Aurora','🌅',2.45,'Aurora'],['Pugno del Titano','🗿',2.7,'Terremoto'],['Lama Celestiale','🪽',2.8,'Ali'],['Cuore del Drago','❤️‍🔥',3,'Drago']];const effects=Ws.map(w=>w[3]);function load(){try{let z=JSON.parse(S.getItem(K)||'{}');Object.assign(window,{level:z.level||1,coins:z.coins??500,gems:z.gems??300,score:z.score||0,hero:z.hero||0,weapon:Math.min(z.weapon||0,24),wxp:z.wxp||0,wlv:z.wlv||1,forge:z.forge||0,treasures:z.treasures||0,kills:z.kills||0,bosses:z.bosses||0,shots:z.shots||0})}catch(e){}}function save(){S.setItem(K,JSON.stringify({level,coins,gems,score,hero,weapon,wxp,wlv,forge,treasures,kills,bosses,shots}))}function resize(){W=c.width=innerWidth;H=c.height=innerHeight;if(!stars.length)for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.8+.3})}addEventListener('resize',resize);resize();load();function ui(){stats.textContent=`❤️${lives} 🪙${coins} 💎${gems} ⭐${score}`;lv.textContent=`Lv${level}/60 · ${Ws[weapon][0]} · 🔥${combo}`}function toast(a){let z=document.getElementById('toast');z.textContent=a;z.classList.add('on');setTimeout(()=>z.classList.remove('on'),900)}function sling(){return{x:W*.18,y:H*.67}}function newLevel(){objs=[];let n=Math.min(10,2+Math.floor(level/3));for(let i=0;i<n;i++){let ranged=i%5===4;let hp=(1+level*.17)*(i%4===3?2.1:1);objs.push({t:ranged?'f':'e',x:W*(.46+i*.052),y:H*(.22+(i%4)*.13),hp,max:hp,elite:i%4===3&&level>4,cd:50+i*9})}if(level%3===0){let m=18+level*3;objs.push({t:'b',x:W*.78,y:H*.34,hp:m,m,phase:1,cd:70})}if(level%5===0)objs.push({t:'q',x:W*.63,y:H*.57,w:70,h:30,hp:1});ui();toast(`☁️ Livello ${level}`)}function burst(a,b,ch,n=14){for(let i=0;i<n;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:28+Math.random()*20,ch,s:12+Math.random()*12,enemy:false})}function xp(n){wxp+=n;let need=40+wlv*32;while(wxp>=need&&wlv<30){wxp-=need;wlv++;coins+=10;toast('⚔️ Arma Lv '+wlv);need=40+wlv*32}save()}function finish(){if(objs.some(o=>o.t==='e'||o.t==='f'||o.t==='b'||o.t==='q')){lives--;combo=0;if(lives<=0){lives=3;level=Math.max(1,level-2);toast('💥 Sconfitta: -2 livelli')}save();newLevel();return}shot=null;drag=0;if(level<60){level++;coins+=10;gems+=20}else{gems+=100;toast('🏆 CAMPAGNA V60 COMPLETATA!')}save();newLevel()}function hit(o,p){if(o.t==='b')return Math.hypot(p.x-o.x,p.y-o.y)<50+p.r;if(o.t==='q')return p.x>o.x-o.w/2-p.r&&p.x<o.x+o.w/2+p.r&&p.y>o.y-o.h/2-p.r&&p.y<o.y+o.h/2+p.r;return Math.hypot(p.x-o.x,p.y-o.y)<(o.elite?30:24)+p.r}function weaponEffect(o,d){let e=effects[weapon];if(e==='Gelo'){o.slow=90;d*=1.15}if(e==='Stordisci'){o.stun=55}if(e==='Sanguinamento'){o.bleed=100;d*=1.1}if(e==='Brucia'){o.burn=100;d*=1.12}if(e==='Vuoto')d*=1.22;if(e==='Catena')objs.filter(q=>q!==o&&(q.t==='e'||q.t==='f')&&Math.hypot(q.x-o.x,q.y-o.y)<125).forEach(q=>{q.hp-=d*.35;burst(q.x,q.y,'⚡',8)});if(e==='Turbine'){o.x=Math.min(W-70,o.x+18)}if(e==='Meteora'){burst(o.x,o.y,'☄️',24);d*=1.18}if(['Esplosione','Onda','Terremoto'].includes(e)){objs.filter(q=>q!==o&&(q.t==='e'||q.t==='f')&&Math.hypot(q.x-o.x,q.y-o.y)<105).forEach(q=>q.hp-=d*.45);burst(o.x,o.y,'💥',22)}if(['Fiamma','Drago'].includes(e)){d*=1.3;burst(o.x,o.y,'🔥',12)}if(['Stella','Prisma','Aurora'].includes(e)){d*=1.18;gems++}if(['Benedizione','Ali'].includes(e)){inv=Math.max(inv,18);d*=1.1}if(['Spiriti','Nebbia'].includes(e))d*=1.12;if(e==='Saetta'){d*=1.25;burst(o.x,o.y,'⚡',12)}return d}function skillUse(){if(skillCd)return;let m=Hs[hero][1]===5?3.2:Hs[hero][1]===4?2.6:2.1;objs.filter(o=>o.t!=='q').forEach(o=>{o.hp-=Ws[weapon][2]*m*(1+forge*.05);burst(o.x,o.y,Ws[weapon][1],18)});skillCd=170;combo+=2;shake=8;ui()}function ultimate(){if(ultCd)return;let e=Hs[hero][3];let mult=[3.8,4.2,3.6,4,5.5,4,5.2,6][hero];objs.filter(o=>o.t!=='q').forEach(o=>{o.hp-=Ws[weapon][2]*mult*(1+forge*.08);burst(o.x,o.y,e,35)});ultCd=300;combo+=4;inv=70;shake=14;gems+=3;toast(e+' ULTIMATE!');ui()}function dodgeUse(){if(dodgeCd)return;inv=55;dodgeCd=105;burst(sling().x,sling().y,'💨',12)}play.onclick=()=>{menu.classList.add('hidden');newLevel()};skill.onclick=skillUse;dodge.onclick=dodgeUse;ult.onclick=ultimate;function show(q){sub.classList.remove('hidden');if(q==='heroes')content.innerHTML='<h1>👤 EROI</h1>'+Hs.map((h,i)=>`<div class=item><b>${h[3]} ${h[0]} · ${'★'.repeat(h[1])}</b><span class=small>${h[2]} · Ultimate ${h[3]}</span><br><button onclick="sh(${i})">${hero===i?'SELEZIONATO':'USA'}</button></div>`).join('');if(q==='weapons')content.innerHTML='<h1>⚔️ ARMI · 25</h1>'+Ws.map((w,i)=>`<div class=item><b>${w[1]} ${w[0]}</b><span class=small>Potenza ${w[2].toFixed(2)} · ${w[3]}</span><br><button onclick="sw(${i})">USA</button></div>`).join('');if(q==='map')content.innerHTML='<h1>🗺️ MAPPA · 60</h1>'+Array.from({length:60},(_,i)=>`<span style="display:inline-flex;width:42px;height:42px;margin:3px;border-radius:50%;align-items:center;justify-content:center;background:${i+1<=level?'#496b49':'#29375f'}">${i+1}</span>`).join('');if(q==='forge')content.innerHTML=`<h1>🔨 FORGIA</h1><p>${Ws[weapon][1]} ${Ws[weapon][0]}</p><p>Forgia +${forge} · danno +${forge*5}%</p><button onclick="up()">POTENZIA · ${150*(forge+1)} 🪙</button>`;if(q==='gacha')content.innerHTML=`<h1>🎲 GACHA</h1><p>💎 ${gems}</p><button onclick="pull(1)">100 💎</button><button onclick="pull(10)">900 💎</button><p class=small>75% base · 20% raro · 5% epico</p><div id=res></div>`;if(q==='missions')content.innerHTML=`<h1>🎯 MISSIONI</h1><div class=item>Colpisci 20 nemici · ${kills%20}/20<br><button onclick="claim(50)">RISCATTA 50 💎</button></div><div class=item>Sconfiggi 3 boss · ${bosses%3}/3<br><button onclick="claim(100)">RISCATTA 100 💎</button></div><div class=item>50 tiri · ${shots%50}/50<br><button onclick="claim(75)">RISCATTA 75 💎</button></div>`;if(q==='ach')content.innerHTML=`<h1>🏆 OBIETTIVI</h1><div class=item>⚔️ ${kills} eliminazioni</div><div class=item>👑 ${bosses} boss</div><div class=item>🎁 ${treasures} tesori</div><div class=item>🌟 Livello ${level}/60</div>`;if(q==='shop')content.innerHTML=`<h1>🛒 NEGOZIO</h1><div class=item>💎 100 gemme → 500 🪙<br><button onclick="buy()">COMPRA</button></div><div class=item>❤️ +1 vita → 150 🪙<br><button onclick="buyLife()">COMPRA</button></div>`}window.sh=i=>{hero=i;save();show('heroes')};window.sw=i=>{weapon=i;wxp=0;wlv=1;forge=0;save();show('weapons');toast('⚔️ '+Ws[i][0])};window.up=()=>{let cost=150*(forge+1);if(coins<cost)return toast('Monete insufficienti');coins-=cost;forge++;save();show('forge');ui()};window.pull=n=>{let cost=n===10?900:100;if(gems<cost)return toast('Gemme insufficienti');gems-=cost;let out=[];for(let j=0;j<n;j++){let w=Ws[Math.random()*Ws.length|0];weapon=Ws.indexOf(w);out.push(w[1]+' '+w[0])}document.getElementById('res').innerHTML='<div class=item>'+out.join('<br>')+'</div>';save();ui()};window.claim=n=>{gems+=n;save();show('missions');toast('🎁 Ricompensa!')};window.buy=()=>{if(gems<100)return toast('Gemme insufficienti');gems-=100;coins+=500;save();show('shop');ui()};window.buyLife=()=>{if(coins<150)return toast('Monete insufficienti');coins-=150;lives++;save();show('shop');ui()};heroes.onclick=()=>show('heroes');weapons.onclick=()=>show('weapons');gacha.onclick=()=>show('gacha');map.onclick=()=>show('map');forge.onclick=()=>show('forge');missions.onclick=()=>show('missions');ach.onclick=()=>show('ach');shop.onclick=()=>show('shop');back.onclick=()=>sub.classList.add('hidden');c.onpointerdown=e=>{if(shot)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling();if(Math.hypot(p.x-s.x,p.y-s.y)<105){drag=1;c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(!drag)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling(),d=Math.min(160,Math.hypot(p.x-s.x,p.y-s.y));pow.style.width=d/160*100+'%'};c.onpointerup=e=>{if(!drag)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling(),dx=s.x-p.x,dy=s.y-p.y,d=Math.hypot(dx,dy);drag=0;pow.style.width=0;if(d>12){shot={x:s.x,y:s.y,vx:dx/d*Math.min(d,160)/17,vy:dy/d*Math.min(d,160)/17,r:16,trail:[]};shots++;save()}};function enemyAI(o){if(o.slow)o.slow--;if(o.stun)o.stun--;if(o.bleed){o.bleed--;if(t%10===0)o.hp-=.08}if(o.burn){o.burn--;if(t%8===0)o.hp-=.12}if(o.cd)o.cd--;if((o.t==='f'||o.t==='b')&&!o.stun&&o.cd<=0&&inv<=0){parts.push({x:o.x,y:o.y,vx:-3-(o.t==='b'?1:0),vy:(sling().y-o.y)/100,l:90,ch:o.t==='b'?(o.phase===2?'🔥':'💜'):'🔮',s:22,enemy:true});o.cd=o.t==='b'?(o.phase===2?55:90):115}}function update(){if(skillCd)skillCd--;if(dodgeCd)dodgeCd--;if(ultCd)ultCd--;if(inv)inv--;if(shake>0)shake*=.86;t++;objs.forEach(enemyAI);if(shot){shot.vy+=.2;shot.x+=shot.vx;shot.y+=shot.vy;shot.trail.push({x:shot.x,y:shot.y});if(shot.trail.length>12)shot.trail.shift();for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(hit(o,shot)){if(o.t==='q'){treasures++;gems+=100;coins+=60;toast('🎁 TESORO RARO!')}else{let d=Ws[weapon][2]*(1+Math.min(combo,18)*.035)*(1+forge*.05)*(1+(wlv-1)*.015);if(o.elite)d*=.78;if(hero===4&&o.t==='b')d*=1.5;d=weaponEffect(o,d);if(Math.random()<.08){d*=2;toast('💥 CRIT!')}o.hp-=d;combo++;if(o.t==='e'||o.t==='f')kills++;if(o.t==='b'){bosses+=o.hp<=0?1:0;coins+=o.hp<=0?30:0;gems+=o.hp<=0?35+level:0}else{coins+=o.elite?5:1}score+=o.t==='b'?70:o.elite?30:10;xp(o.t==='b'?50:8);burst(o.x,o.y,Ws[weapon][1]);shake=5;if(o.t==='b'&&o.hp<o.m*.5&&o.phase===1){o.phase=2;toast('🔥 BOSS IN RAGE!');burst(o.x,o.y,'🔥',35);shake=10}}if(o.hp<=0)objs.splice(i,1);shot.vx*=.86;shot.vy*=.86;if(Math.hypot(shot.vx,shot.vy)<1.3){shot=null;finish();break}}}if(shot&&(shot.x>W+90||shot.y>H+90||shot.x<-90)){shot=null;finish()}}for(let i=parts.length-1;i>=0;i--){let p=parts[i];if(p.enemy&&p.l<65&&Math.hypot(p.x-sling().x,p.y-sling().y)<42){if(inv<=0){lives--;toast('💥 COLPITO!');shake=8}p.l=0}p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l--}parts=parts.filter(p=>p.l>0);let b=objs.find(o=>o.t==='b');bb.style.display=b?'block':'none';if(b)bb.firstElementChild.style.width=Math.max(0,b.hp/b.m*100)+'%';ui()}function draw(){x.clearRect(0,0,W,H);let sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;x.save();x.translate(sx,sy);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,level%10===0?'#160e3d':'#087db4');g.addColorStop(.7,'#69d8f5');g.addColorStop(1,'#d9f5ff');x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);stars.forEach(s=>{x.globalAlpha=.35+.35*Math.sin(t*.03+s.x*8);x.fillStyle='#fff';x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,7);x.fill()});x.globalAlpha=1;x.fillStyle='#65b95e';x.fillRect(-20,H*.72,W+40,H*.28);let s=sling();x.strokeStyle='#57351f';x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(s.x-14,s.y+48);x.lineTo(s.x,s.y);x.lineTo(s.x+18,s.y+48);x.stroke();x.strokeStyle='#d8a35b';x.lineWidth=3;x.beginPath();x.moveTo(s.x-4,s.y+5);x.lineTo(s.x-18,s.y-4);x.moveTo(s.x+4,s.y+5);x.lineTo(s.x+18,s.y-4);x.stroke();if(drag){x.strokeStyle='#fff8';x.setLineDash([7,7]);x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x*2-(s.x-(W*.18)),s.y*2-(s.y-(H*.67)));x.stroke();x.setLineDash([])}objs.forEach(o=>{x.save();x.translate(o.x,o.y);if(o.t==='q'){x.shadowBlur=18;x.shadowColor='#6ff';x.fillStyle='#bd8739';x.fillRect(-35,-15,70,30);x.shadowBlur=0;x.font='22px sans-serif';x.textAlign='center';x.fillText('💎',0,8)}else if(o.t==='b'){x.shadowBlur=25;x.shadowColor=o.phase===2?'#f44':'#c45cff';x.fillStyle=o.phase===2?'#8b142d':'#54247c';x.beginPath();x.arc(0,0,48,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.font='bold 14px system-ui';x.textAlign='center';x.fillText(o.phase===2?'RAGE':'BOSS',0,5)}else{let r=o.elite?27:21,base=o.t==='f'?'#5c5cff':o.elite?'#e56b16':'#a91f3f';x.fillStyle=base;x.shadowBlur=12;x.shadowColor=base;x.beginPath();x.arc(0,0,r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.beginPath();x.arc(-7,-4,5,0,7);x.arc(7,-4,5,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-7,-3,2,0,7);x.arc(7,-3,2,0,7);x.fill();x.font='16px sans-serif';x.textAlign='center';x.fillText(o.t==='f'?'🔮':o.elite?'★':'',0,-34)}x.restore()});parts.forEach(p=>{x.globalAlpha=Math.max(0,p.l/90);x.font=`${p.s}px sans-serif`;x.fillText(p.ch,p.x,p.y)});x.globalAlpha=1;if(shot){shot.trail.forEach((q,i)=>{x.globalAlpha=i/18;x.fillStyle='#fff';x.beginPath();x.arc(q.x,q.y,Math.max(3,shot.r*i/16),0,7);x.fill()});x.globalAlpha=1;x.shadowBlur=22;x.shadowColor='#ffe36a';x.fillStyle='#ffd34d';x.beginPath();x.arc(shot.x,shot.y,shot.r,0,7);x.fill();x.shadowBlur=0;x.font='22px sans-serif';x.textAlign='center';x.fillText(Ws[weapon][1],shot.x,shot.y+7)}x.restore()}function loop(){update();draw();requestAnimationFrame(loop)}ui();loop()</script></body></html>
