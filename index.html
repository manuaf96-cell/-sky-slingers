<!doctype html><html lang=it><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sky Slingers V14</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#10152b;color:#fff;font-family:system-ui;touch-action:none}canvas{width:100%;height:100%}button{border:0;border-radius:14px;padding:10px 13px;margin:4px;font-weight:900}.dark{background:#293452;color:#fff}.hud{position:fixed;top:7px;left:0;right:0;display:flex;justify-content:space-between;padding:8px;z-index:3}.pill,.card{background:#18203bf2;border:1px solid #fff3;border-radius:18px;padding:10px}.panel{position:fixed;inset:0;background:#10152bf2;display:flex;align-items:center;justify-content:center;z-index:6}.card{width:min(93vw,540px);max-height:90vh;overflow:auto;text-align:center}.hidden{display:none!important}.item{background:#222d4d;border-radius:13px;padding:9px;margin:5px;text-align:left}.small{font-size:12px;opacity:.75}.skill{position:fixed;right:8px;bottom:18px;z-index:4}.dodge{position:fixed;left:8px;bottom:18px;z-index:4}.power{position:fixed;left:29%;bottom:30px;width:42%;height:9px;background:#1119}.power i{display:block;height:100%;background:#fff;width:0}.boss{position:fixed;left:12%;right:12%;top:57px;height:12px;background:#111;display:none}.boss i{display:block;height:100%;background:#e33}.toast{position:fixed;top:22%;left:50%;transform:translateX(-50%);background:#111e;padding:10px;border-radius:14px;opacity:0;z-index:9}.toast.on{opacity:1}</style><body><canvas id=c></canvas><div class=hud><div class=pill id=stats></div><div class=pill id=lv></div></div><div class=boss id=bb><i></i></div><div class=power><i id=pow></i></div><button class=skill id=skill>⚡</button><button class=dodge id=dodge>💨</button><div id=toast class=toast></div><div id=menu class=panel><div class=card><h1>☁️ Sky Slingers</h1><p>V14 · 15 armi · Elite · Tesori · Boss</p><button id=play>GIOCA</button><button class=dark id=heroes>EROI</button><button class=dark id=weapons>ARMI</button><button class=dark id=gacha>GACHA</button><button class=dark id=map>MAPPA</button><button class=dark id=treasure>TESORI</button><p class=small>Nuovi nemici Elite più resistenti e scrigni premio durante la campagna.</p></div></div><div id=sub class="panel hidden"><div class=card><div id=content></div><button class=dark id=back>INDIETRO</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),S=localStorage,K='skySlingers';let W,H,drag=0,aim={},shot=null,objs=[],parts=[],level=1,coins=0,gems=300,score=0,lives=3,hero='lampo',weapon=0,wxp=0,wlv=1,combo=0,skillCd=0,dodgeCd=0,inv=0,t=0,treasures=0;const Hs=[['lampo','Lampo',3,'Fulmine'],['nova','Nova',3,'Esplosione'],['astra','Astra',4,'Tempesta'],['riven','Riven',4,'Ombra'],['drakon','Drakon',5,'Furia del Drago']].map(a=>({id:a[0],n:a[1],r:a[2],skill:a[3]}));const Ws=[['Spada del Vento','🌪️',1,3,'Combo +5%'],['Arco Solare','☀️',1.2,3,'Crit +3%'],['Daga del Crepuscolo','🌒',1.1,3,'Critico +25%'],['Martello Titanico','🔨',1.6,4,'Stordimento'],['Lancia Stellare','✨',1.35,4,'Boss +10%'],['Falce del Drago','🐉',1.8,5,'Boss +20%'],['Arco del Tuono','⚡',1.55,5,'Area'],['Spada Lunare','🌙',2,5,'Crit +8%'],['Bastone Astrale','🔮',1.45,4,'Skill +15%'],['Pugno Meteora','☄️',1.7,4,'Impatto +12%'],['Katana Cremisi','🩸',1.9,5,'Crit +10%'],['Arco Glaciale','❄️',1.5,4,'Rallenta'],['Ascia Vulcanica','🌋',2.1,5,'Esplosivo'],['Lama del Vuoto','🕳️',2.2,5,'Ignora difesa'],['Corona Celeste','👑',2.4,5,'Bonus +10%']].map(a=>({n:a[0],e:a[1],p:a[2],s:a[3],pass:a[4]}));function load(){try{let z=JSON.parse(S.getItem(K)||'{}');level=z.level||1;coins=z.coins||0;gems=z.gems??300;score=z.score||0;hero=z.hero||'lampo';weapon=Math.min(z.weapon||0,14);wxp=z.wxp||0;wlv=z.wlv||1;treasures=z.treasures||0}catch(e){}}function save(){S.setItem(K,JSON.stringify({level,coins,gems,score,hero,weapon,wxp,wlv,treasures}))}function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();load();function ui(){stats.textContent=`❤️${lives} 🪙${coins} 💎${gems} ⭐${score}`;lv.textContent=`Lv${level} · ${Ws[weapon].n} Lv${wlv} · 🔥${combo}`}function toast(a){let z=document.getElementById('toast');z.textContent=a;z.classList.add('on');setTimeout(()=>z.classList.remove('on'),900)}function sling(){return{x:W*.18,y:H*.67}}function newLevel(){objs=[];let n=Math.min(7,2+Math.floor(level/2));for(let i=0;i<n;i++)objs.push({t:i%4===3?'e':'e',x:W*(.5+i*.065),y:H*(.24+i%3*.17),hp:1+level*.13,elite:level>4&&i%4===3});if(level%3===0)objs.push({t:'b',x:W*.78,y:H*.34,hp:10+level*2,m:10+level*2});if(level%5===0)objs.push({t:'q',x:W*.62,y:H*.58,w:70,h:25,hp:3,treasure:1});ui()}function burst(a,b,ch){for(let i=0;i<8;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,l:28,ch})}function xp(n){wxp+=n;let need=45+wlv*30;while(wxp>=need&&wlv<20){wxp-=need;wlv++;toast('⚔️ Arma Lv '+wlv);need=45+wlv*30}save()}function end(){shot=null;drag=0;setTimeout(()=>{if(objs.some(o=>o.t==='e'||o.t==='b')){lives--;combo=0;if(lives<=0){lives=3;level=1;score=0;toast('Game Over')}}else{level++;coins+=5;gems+=25}save();newLevel()},350)}function hit(o,p){if(o.t==='b')return Math.hypot(p.x-o.x,p.y-o.y)<50+p.r;if(o.t==='e')return Math.hypot(p.x-o.x,p.y-o.y)<24+p.r;return p.x>o.x-o.w/2-p.r&&p.x<o.x+o.w/2+p.r&&p.y>o.y-o.h/2-p.r&&p.y<o.y+o.h/2+p.r}function skillUse(){if(skillCd)return;let h=Hs.find(a=>a.id===hero),m=h.r===5?3:h.r===4?2.5:2;objs.filter(o=>o.t==='e'||o.t==='b').forEach(o=>{o.hp-=Ws[weapon].p*m;burst(o.x,o.y,'✨')});skillCd=180;combo+=2;ui()}function dodgeUse(){if(dodgeCd)return;inv=45;dodgeCd=100;toast('💨 Schivata!')}play.onclick=()=>{menu.classList.add('hidden');newLevel()};skill.onclick=skillUse;dodge.onclick=dodgeUse;function show(q){sub.classList.remove('hidden');if(q==='treasure')content.innerHTML=`<h1>🎁 TESORI</h1><p>Scrigni trovati: ${treasures}</p><p>Ogni scrigno ha dato gemme e monete bonus.</p>`;if(q==='heroes')content.innerHTML='<h1>👤 EROI</h1>'+Hs.map(h=>`<div class=item><b>${h.n} · ${'★'.repeat(h.r)}</b><span class=small>${h.skill}</span><br><button onclick="sh('${h.id}')">${hero===h.id?'SELEZIONATO':'USA'}</button></div>`).join('');if(q==='weapons')content.innerHTML='<h1>⚔️ ARMI · 15</h1>'+Ws.map((w,i)=>`<div class=item><b>${w.e} ${w.n} · ${'★'.repeat(w.s)}</b><span class=small>Potenza ${w.p} · ${w.pass}</span><br><button onclick="sw(${i})">USA</button></div>`).join('');if(q==='map')content.innerHTML='<h1>🗺️ CAMPAGNA</h1>'+Array.from({length:40},(_,i)=>`<span style="display:inline-flex;width:43px;height:43px;margin:3px;border-radius:50%;align-items:center;justify-content:center;background:${i+1<=level?'#496b49':'#29375f'}">${i+1}</span>`).join('');if(q==='gacha')content.innerHTML=`<h1>🎲 GACHA</h1><p>💎 ${gems}</p><button onclick="pull(1)">100 💎</button><button onclick="pull(10)">900 💎</button><p class=small>75% ★3 · 20% ★4 · 5% ★5</p><div id=res></div>`}window.sh=id=>{hero=id;save();show('heroes')};window.sw=i=>{weapon=i;wxp=0;wlv=1;save();show('weapons');toast('⚔️ Equipaggiata')};window.pull=n=>{let cost=n===10?900:100;if(gems<cost)return toast('Gemme insufficienti');gems-=cost;let o=[];for(let j=0;j<n;j++){let r=Math.random()<.05?5:Math.random()<.25?4:3,p=Ws.filter(w=>w.s===r),w=p[Math.random()*p.length|0];weapon=Ws.indexOf(w);o.push(w.e+' '+w.n+' ★'+w.s)}res.innerHTML='<div class=item>'+o.join('<br>')+'</div>';save();ui()};heroes.onclick=()=>show('heroes');weapons.onclick=()=>show('weapons');gacha.onclick=()=>show('gacha');map.onclick=()=>show('map');treasure.onclick=()=>show('treasure');back.onclick=()=>sub.classList.add('hidden');c.onpointerdown=e=>{if(shot)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling();if(Math.hypot(p.x-s.x,p.y-s.y)<100){drag=1;aim=p;c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(!drag)return;let r=c.getBoundingClientRect();aim={x:e.clientX-r.left,y:e.clientY-r.top};let s=sling(),d=Math.min(150,Math.hypot(aim.x-s.x,aim.y-s.y));pow.style.width=d/150*100+'%'};c.onpointerup=e=>{if(!drag)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling(),dx=s.x-p.x,dy=s.y-p.y,d=Math.hypot(dx,dy);drag=0;pow.style.width=0;if(d>12)shot={x:s.x,y:s.y,vx:dx/d*Math.min(d,150)/17,vy:dy/d*Math.min(d,150)/17,r:16}};function update(){if(skillCd)skillCd--;if(dodgeCd)dodgeCd--;if(inv)inv--;if(!shot)return;shot.vy+=.2;shot.x+=shot.vx;shot.y+=shot.vy;for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(hit(o,shot)){let dmg=Ws[weapon].p*(1+Math.min(combo,15)*.04)*(o.elite?1:1);if(o.elite)dmg*=.75;if(hero==='drakon'&&o.t==='b')dmg*=1.5;if(Ws[weapon].pass.includes('Boss')&&o.t==='b')dmg*=1.1;if(Ws[weapon].pass.includes('Crit')&&Math.random()<.15)dmg*=2;o.hp-=dmg;combo++;score+=o.t==='b'?50:o.elite?25:10;coins+=o.t==='b'?20:o.elite?4:1;xp(o.t==='b'?40:7);burst(o.x,o.y,Ws[weapon].e);if(o.hp<=0){if(o.t==='b'){gems+=30+level;toast('🏆 BOSS!')}if(o.t==='q'){treasures++;gems+=80;coins+=40;toast('🎁 SCRIGNO!')}objs.splice(i,1)}if(Math.hypot(shot.vx,shot.vy)<1.2){end();break}}}if(shot&&(shot.x>W+80||shot.y>H+80||shot.x<-80))end();let b=objs.find(o=>o.t==='b');if(b){bb.style.display='block';bb.firstElementChild.style.width=Math.max(0,b.hp/b.m*100)+'%';t++;if(t%100===0&&inv<=0){lives=Math.max(1,lives-1);toast('⚠️ Attacco boss!')}}else bb.style.display='none';save();ui()}function draw(){x.clearRect(0,0,W,H);x.fillStyle=level%3===0?'#405d99':level>8?'#28365f':'#54c7ff';x.fillRect(0,0,W,H);x.fillStyle='#70b85a';x.fillRect(0,H*.72,W,H*.28);let s=sling();x.strokeStyle='#633d24';x.lineWidth=9;x.beginPath();x.moveTo(s.x-12,s.y+48);x.lineTo(s.x,s.y);x.lineTo(s.x+18,s.y+48);x.stroke();objs.forEach(o=>{x.save();x.translate(o.x,o.y);if(o.t==='e'){x.fillStyle=o.elite?'#ff9d2e':'#e55353';x.beginPath();x.arc(0,0,o.elite?25:19,0,7);x.fill();x.fillStyle='#fff';x.fillRect(-8,-6,6,7);x.fillRect(3,-6,6,7);if(o.elite){x.font='16px sans-serif';x.fillText('★',-7,-30)}}else if(o.t==='q'){x.fillStyle='#c78b35';x.fillRect(-o.w/2,-o.h/2,o.w,o.h);x.font='20px sans-serif';x.fillText('💎',-10,7)}else{x.fillStyle='#713d91';x.beginPath();x.arc(0,0,45,0,7);x.fill();x.fillStyle='#fff';x.font='bold 18px sans-serif';x.textAlign='center';x.fillText('BOSS',0,6)}x.restore()});parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l--;x.globalAlpha=p.l/28;x.font='18px sans-serif';x.fillText(p.ch,p.x,p.y)});x.globalAlpha=1;if(shot){x.fillStyle='#ffcc33';x.beginPath();x.arc(shot.x,shot.y,shot.r,0,7);x.fill();x.font='21px sans-serif';x.textAlign='center';x.fillText(Ws[weapon].e,shot.x,shot.y+7)}}function loop(){update();draw();requestAnimationFrame(loop)}ui();loop()</script></body></html>
