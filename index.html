<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sky Slingers V70</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071126;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}button{border:1px solid #ffffff28;border-radius:15px;padding:11px 14px;margin:4px;font-weight:900;color:#fff;background:linear-gradient(180deg,#526da8,#30456f);box-shadow:0 5px 16px #0007}button:active{transform:scale(.96)}button:disabled{opacity:.4}.hud{position:fixed;top:7px;left:0;right:0;display:flex;justify-content:space-between;padding:7px;z-index:3;pointer-events:none}.pill,.card{background:#101b35e8;border:1px solid #ffffff20;border-radius:20px;box-shadow:0 10px 30px #0007}.pill{padding:8px 10px}.panel{position:fixed;inset:0;background:#050b18ed;display:flex;align-items:center;justify-content:center;z-index:6}.card{width:min(94vw,560px);max-height:92vh;overflow:auto;text-align:center;padding:20px}.hidden{display:none!important}.skill,.dodge,.audio{position:fixed;bottom:16px;z-index:4}.skill{right:6px}.dodge{left:6px}.audio{right:50%;transform:translateX(50%);bottom:7px;padding:7px 11px;font-size:12px}.boss{position:fixed;left:10%;right:10%;top:58px;height:14px;background:#080b13dd;border-radius:20px;display:none;z-index:3;overflow:hidden}.boss i{display:block;height:100%;background:linear-gradient(90deg,#ff315f,#ff9b5c)}.power{position:fixed;left:27%;bottom:29px;width:46%;height:10px;background:#08101fcc;border-radius:20px;overflow:hidden;z-index:4}.power i{display:block;height:100%;background:linear-gradient(90deg,#61d8ff,#fff36b);width:0}.toast{position:fixed;top:20%;left:50%;transform:translate(-50%,-10px);background:#101b35f5;padding:11px 16px;border-radius:18px;opacity:0;z-index:9;transition:.18s}.toast.on{opacity:1;transform:translate(-50%,0)}.item{background:#ffffff0b;border:1px solid #ffffff14;border-radius:14px;padding:9px;margin:6px 0}.rar{display:inline-block;margin:3px}.small{font-size:12px;opacity:.72}</style><body><canvas id=c></canvas><div class=hud><div class=pill id=stats></div><div class=pill id=lv></div></div><div class=boss id=bb><i></i></div><div class=power><i id=pow></i></div><button class=skill id=skill>⚡ ABILITÀ</button><button class=dodge id=dodge>💨 SCHIVATA</button><button class=audio id=audio>🔊 AUDIO</button><div id=toast class=toast></div><div id=menu class=panel><div class=card><div style="font-size:56px">☁️</div><h1>Sky Slingers</h1><p>V70 · combattimento dinamico</p><button id=play>🚀 GIOCA</button><button id=heroes>EROI</button><button id=weapons>ARMI</button><button id=gacha>💎 GACHA</button><button id=map>MAPPA</button><button id=forge>FORGIA</button><button id=missions>MISSIONI</button><button id=shop>NEGOZIO</button><p class=small>Nemici attivi · boss a 3 fasi · mira reale.</p></div></div><div id=sub class="panel hidden"><div class=card><div id=content></div><button id=back>INDIETRO</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),K='skySlingers60';let W,H,shot=null,drag=0,objs=[],parts=[],stars=[],enemyShots=[],level=1,coins=500,gems=300,score=0,lives=3,hero=0,weapon=0,wxp=0,wlv=1,forge=0,combo=0,treasures=0,kills=0,shots=0,skillCd=0,dodgeCd=0,inv=0,pity=0,frags=0,owned=[0],AC=null,musicTimer=null,sound=1,last=0;const Hs=[['Lampo',3,'Fulmine'],['Nova',3,'Esplosione'],['Astra',4,'Tempesta'],['Riven',4,'Ombra'],['Drakon',5,'Furia del Drago'],['Lyra',4,'Luna'],['Kairo',5,'Raggio Cosmico'],['Vega',5,'Supernova']];const Ws=[['Spada del Vento','🌪️',1,'Turbine',3],['Arco Solare','☀️',1.2,'Raggio',3],['Daga del Crepuscolo','🌒',1.1,'Ombra',3],['Martello Titanico','🔨',1.6,'Stordisci',4],['Lancia Stellare','✨',1.35,'Stella',4],['Falce del Drago','🐉',1.8,'Fiamma',5],['Arco del Tuono','⚡',1.55,'Catena',5],['Spada Lunare','🌙',2,'Luna',5],['Bastone Astrale','🔮',1.45,'Nova',4],['Pugno Meteora','☄️',1.7,'Meteora',4],['Katana Cremisi','🩸',1.9,'Sanguinamento',5],['Arco Glaciale','❄️',1.5,'Gelo',4],['Ascia Vulcanica','🌋',2.1,'Esplosione',5],['Lama del Vuoto','🕳️',2.2,'Vuoto',5],['Corona Celeste','👑',2.4,'Benedizione',5],['Lama Solare','🔥',2,'Brucia',5],['Arco Nebulare','🌌',2.3,'Nebbia',5],['Martello Galattico','💫',2.5,'Onda',5],['Falce Spettrale','👻',2.25,'Spiriti',5],['Lancia del Fulmine','⚡',2.35,'Saetta',5],['Spada Prismatica','🌈',2.55,'Prisma',5],['Arco dell’Aurora','🌅',2.45,'Aurora',5],['Pugno del Titano','🗿',2.7,'Terremoto',5],['Lama Celestiale','🪽',2.8,'Ali',5],['Cuore del Drago','❤️‍🔥',3,'Drago',5]];function save(){localStorage.setItem(K,JSON.stringify({level,coins,gems,score,hero,weapon,wxp,wlv,forge,combo,treasures,kills,shots,pity,frags,owned}))}function load(){try{let d=JSON.parse(localStorage.getItem(K)||'{}');Object.assign(window,d);owned=Array.isArray(owned)?[...new Set(owned.filter(i=>i>=0&&i<Ws.length))]:[0];if(!owned.includes(0))owned.unshift(0)}catch(e){}}function resize(){W=c.width=innerWidth;H=c.height=innerHeight;if(!stars.length)for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.8+.3})}addEventListener('resize',resize);resize();load();function tone(f,d=.1,type='sine',v=.05,slide=1){if(!sound||!AC)return;let o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(35,f*slide),n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(AC.destination);o.start();o.stop(n+d+.03)}function audioInit(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(!musicTimer)musicTimer=setInterval(()=>tone(level%3===0?110:220,.15,level%3===0?'sawtooth':'triangle',.018),level%3===0?230:330)}function sfx(n){audioInit();if(n==='hit')tone(130,.07,'square',.04,.7);if(n==='boom')tone(70,.3,'sawtooth',.09,.4);if(n==='coin')tone(880,.09,'square',.05,1.3);if(n==='boss')tone(110,.4,'sawtooth',.08,.5);if(n==='skill')tone(440,.25,'triangle',.07,2);if(n==='hurt')tone(90,.22,'square',.08,.5);if(n==='win')[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.06),i*100))}function ui(){stats.textContent=`❤️${lives} 🪙${coins} 💎${gems} 🔷${frags}`;lv.textContent=`Lv${level}/60 · ${Ws[weapon][0]} · 🔥${combo}`}function toast(a){let z=document.getElementById('toast');z.textContent=a;z.classList.add('on');setTimeout(()=>z.classList.remove('on'),1200)}function burst(a,b,ch,n=16){for(let i=0;i<n;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:30,ch})}function newLevel(){objs=[];enemyShots=[];combo=0;boss.style.display='none';let n=Math.min(9,2+Math.floor(level/3));for(let i=0;i<n;i++){let ranged=i%4===3;objs.push({t:ranged?'f':'e',x:W*(.48+(i%5)*.085),y:H*(.22+(i%4)*.13),hp:(1+level*.17)*(i%4===2?1.7:1),max:1+level*.17,elite:i%4===2&&level>4,cd:900+Math.random()*800})}if(level%3===0){let hp=24+level*4;objs.push({t:'b',x:W*.78,y:H*.34,hp,max:hp,phase:1,cd:700})}if(level%5===0)objs.push({t:'q',x:W*.62,y:H*.58,hp:1});if(level%3===0){sfx('boss');toast('👑 BOSS IN ARRIVO!')}ui()}function targetAt(px,py){return objs.filter(o=>o.hp>0).sort((a,b)=>Math.hypot(a.x-px,a.y-py)-Math.hypot(b.x-px,b.y-py))[0]}function weaponBonus(){let w=Ws[weapon],d=w[2]*(1+forge*.04)*(1+Hs[hero][1]*.06)*(1+wlv*.035);if(w[3]==='Drago'&&level%3===0)d*=1.25;if(w[3]==='Vuoto')d*=1.1;return d}function damage(o){if(!o||o.hp<=0)return;let d=weaponBonus();if(Math.random()<.12){d*=1.8;toast('💥 CRITICO!')}o.hp-=d;combo++;score+=Math.ceil(d);sfx('hit');if(o.t==='b'&&o.hp<=o.max*.66&&o.phase===1){o.phase=2;o.cd=350;burst(o.x,o.y,'🔥',35);toast('🔥 BOSS FASE 2!')}if(o.t==='b'&&o.hp<=o.max*.33&&o.phase===2){o.phase=3;o.cd=220;burst(o.x,o.y,'💀',45);toast('☠️ BOSS FASE 3!')}if(o.hp<=0){kills++;wxp+=10;coins+=3;burst(o.x,o.y,'💥',20);sfx('boom');while(wxp>=wlv*40&&wlv<30){wxp-=wlv*40;wlv++;toast('⬆️ ARMA LV '+wlv)}if(o.t==='b'){coins+=30;gems+=50;toast('👑 BOSS SCONFITTO! +50💎')}}ui();save();setTimeout(check,80)}function collectTreasure(o){if(!o||o.hp<=0)return;o.hp=0;treasures++;gems+=30;coins+=20;burst(o.x,o.y,'💎',24);sfx('coin');toast('🎁 +30💎 +20🪙');save();setTimeout(check,80)}function hurtPlayer(){if(inv>0)return;lives--;inv=90;sfx('hurt');toast('💔 COLPITO!');burst(W*.18,H*.67,'💔',12);if(lives<=0){toast('☠️ SCONFITTA');setTimeout(()=>{lives=3;newLevel()},900)}ui()}function check(){if(objs.some(o=>o.hp>0))return;if(level<60){level++;coins+=10;gems+=20;sfx('win');save();newLevel()}else{gems+=100;sfx('win');toast('🏆 CAMPAGNA COMPLETATA!');save()}}function gachaOne(){if(gems<100)return null;gems-=100;pity++;let guaranteed=pity>=10,r=Math.random(),rar=guaranteed?4:(r<.05?5:r<.25?4:3),pool=Ws.filter(w=>w[4]>=rar),w=pool[Math.floor(Math.random()*pool.length)]||Ws[0],idx=Ws.indexOf(w),duplicate=owned.includes(idx);if(guaranteed)pity=0;if(duplicate){frags+=w[4]*5;coins+=20}else{owned.push(idx);weapon=idx}save();return{w,idx,rar,duplicate}}function gacha(n){let cost=n===10?900:100;if(gems<cost){toast('💎 Ti servono '+cost+' gemme');return}let res=[];if(n===10){gems-=900;for(let i=0;i<10;i++){pity++;let guaranteed=pity>=10,r=Math.random(),rar=guaranteed?4:(r<.05?5:r<.25?4:3),pool=Ws.filter(w=>w[4]>=rar),w=pool[Math.floor(Math.random()*pool.length)]||Ws[0],idx=Ws.indexOf(w),dup=owned.includes(idx);if(guaranteed)pity=0;if(dup){frags+=w[4]*5;coins+=20}else{owned.push(idx);weapon=idx}res.push({w,rar,duplicate:dup})}}else res=[gachaOne()];save();openMenu('GACHA',`<p>Spesa: <b>${cost} 💎</b></p>${res.map(r=>`<div class=item><span class=rar>${'⭐'.repeat(r.rar)}</span> ${r.w[1]} <b>${r.w[0]}</b><br><span class=small>${r.duplicate?'Doppione → +'+r.w[4]*5+' 🔷':'NUOVA ARMA · aggiunta alla collezione'}</span></div>`).join('')}<p>💎 ${gems} · 🔷 ${frags} · Pity ${pity}/10 · Armi ${owned.length}/25</p>`)}function openMenu(t,h){menu.classList.add('hidden');sub.classList.remove('hidden');content.innerHTML='<h2>'+t+'</h2>'+h}function closeMenu(){sub.classList.add('hidden');menu.classList.remove('hidden');ui()}function skillUse(){if(skillCd)return;skillCd=1;sfx('skill');objs.filter(o=>o.t!=='q').forEach(o=>o.hp=0);burst(W*.7,H*.35,'⚡',35);setTimeout(()=>skillCd=0,3500);setTimeout(check,100)}function dodgeUse(){if(dodgeCd)return;dodgeCd=1;inv=110;toast('💨 SCHIVATA!');setTimeout(()=>dodgeCd=0,3000)}function enemyAI(dt){for(let o of objs){if(o.hp<=0||o.t==='q')continue;if(o.t==='f'||o.t==='b'){o.cd-=dt;if(o.cd<=0){let power=o.t==='b'?(o.phase===3?2.2:o.phase===2?1.6:1):.75;enemyShots.push({x:o.x,y:o.y,vx:(W*.18-o.x)/70,vy:(H*.67-o.y)/70,power});o.cd=o.t==='b'?(o.phase===3?420:o.phase===2?620:900):1400;burst(o.x,o.y,'⚡',5)}}}for(let p of enemyShots){p.x+=p.vx*dt/16;p.y+=p.vy*dt/16}enemyShots=enemyShots.filter(p=>{if(Math.hypot(p.x-W*.18,p.y-H*.67)<28){hurtPlayer();return false}return p.x>-30&&p.x<W+30&&p.y>-30&&p.y<H+30})}function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#08193d');g.addColorStop(1,'#2573a1');x.fillStyle=g;x.fillRect(0,0,W,H);stars.forEach(s=>{x.globalAlpha=.5;x.fillStyle='#fff';x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,7);x.fill()});x.globalAlpha=1;x.fillStyle='#173b4d';x.fillRect(0,H*.78,W,H*.22);objs.forEach(o=>{if(o.hp<=0)return;x.save();x.translate(o.x,o.y);if(o.t==='b'){x.font='58px serif';x.fillText('👑',-30,20);bb.style.display='block';bb.querySelector('i').style.width=Math.max(0,100*o.hp/o.max)+'%'}else if(o.t==='q'){x.font='42px serif';x.fillText('🎁',-21,15)}else{x.font=o.elite?'42px serif':'34px serif';x.fillText(o.t==='f'?'👾':'👹',-20,12);if(o.elite){x.font='18px serif';x.fillText('⭐',-9,-24)}}x.restore()});enemyShots.forEach(p=>{x.fillStyle='#ff6688';x.beginPath();x.arc(p.x,p.y,7,0,7);x.fill()});let sx=W*.18,sy=H*.67;x.strokeStyle='#e7c48a';x.lineWidth=6;x.beginPath();x.moveTo(sx-16,sy-20);x.lineTo(sx,sy);x.lineTo(sx+16,sy-20);x.stroke();if(shot){x.strokeStyle='#ffffff88';x.lineWidth=3;x.beginPath();x.moveTo(sx,sy);x.lineTo(shot.x,shot.y);x.stroke();x.fillStyle='#ffe66b';x.beginPath();x.arc(shot.x,shot.y,9,0,7);x.fill()}parts.forEach(p=>{x.globalAlpha=p.l/30;x.font='16px serif';x.fillText(p.ch,p.x,p.y)});x.globalAlpha=1;ui()}function update(dt){parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l--});parts=parts.filter(p=>p.l>0);if(inv>0)inv-=dt/16;enemyAI(dt);if(shot&&shot.flying){shot.x+=shot.vx*dt/16;shot.y+=shot.vy*dt/16;shot.vy+=.35*dt/16;for(let o of objs){if(o.hp>0&&Math.hypot(shot.x-o.x,shot.y-o.y)<42){if(o.t==='q')collectTreasure(o);else damage(o);shot=null;drag=0;break}}if(shot&&(shot.x>W||shot.y>H||shot.y<0)){shot=null;drag=0;setTimeout(check,80)}}}function loop(t){let dt=Math.min(40,t-last||16);last=t;update(dt);draw();requestAnimationFrame(loop)}play.onclick=()=>{audioInit();menu.classList.add('hidden');lives=3;newLevel()};audio.onclick=()=>{sound=!sound;audio.textContent=sound?'🔊 AUDIO':'🔇 AUDIO';if(!sound&&musicTimer){clearInterval(musicTimer);musicTimer=null}else audioInit()};skill.onclick=skillUse;dodge.onclick=dodgeUse;back.onclick=closeMenu;heroes.onclick=()=>openMenu('EROI',Hs.map((h,i)=>`<button onclick="hero=${i};save();closeMenu()">${h[0]} · ${h[2]} ⭐${h[1]}</button>`).join(''));weapons.onclick=()=>openMenu('ARMI',Ws.map((w,i)=>`<button ${owned.includes(i)?'':'disabled'} onclick="weapon=${i};save();closeMenu()">${w[1]} ${w[0]} · ${w[3]} · ⭐${w[4]} ${owned.includes(i)?'':'🔒'}</button>`).join(''));gacha.onclick=()=>openMenu('GACHA',`<p>💎 <b>${gems}</b> gemme · 🔷 ${frags} frammenti</p><p>1 = 100 💎 · 10 = 900 💎</p><button onclick="gacha(1)">✨ 1 ESTRAZIONE</button><button onclick="gacha(10)">🌟 10 ESTRAZIONI</button><p>🎯 Pity ${pity}/10 · alla 10ª almeno 4★</p><p>📦 ${owned.length}/25 armi possedute</p>`);map.onclick=()=>openMenu('MAPPA',`<p>Capitolo ${Math.ceil(level/10)} · Livello ${level}/60</p><p>Progresso ${Math.round(level/60*100)}%</p>`);forge.onclick=()=>{let cost=100*(forge+1);if(coins>=cost){coins-=cost;forge++;sfx('coin');save();toast('🔨 FORGIA +1')}openMenu('FORGIA',`<p>Forgia Lv ${forge}</p><p>Danno +${forge*4}%</p><p>Prossimo costo: ${cost} 🪙</p>`)};missions.onclick=()=>openMenu('MISSIONI',`<p>👹 Nemici sconfitti: ${kills}</p><p>🎁 Tesori: ${treasures}</p><p>🏹 Lanci: ${shots}</p><p>🔥 Combo attuale: ${combo}</p>`);shop.onclick=()=>openMenu('NEGOZIO',`<p>🪙 ${coins} · 💎 ${gems}</p><button onclick="if(coins>=100){coins-=100;gems+=50;save();toast('💎 +50');closeMenu()}">100 🪙 → 50 💎</button>`);addEventListener('pointerdown',e=>{if(menu.classList.contains('hidden')&&sub.classList.contains('hidden')){let sx=W*.18,sy=H*.67;if(Math.hypot(e.clientX-sx,e.clientY-sy)<75){drag=1;shot={x:sx,y:sy,vx:0,vy:0,flying:false}}}});addEventListener('pointermove',e=>{if(drag&&shot){shot.x=e.clientX;shot.y=e.clientY;pow.style.width=Math.min(100,Math.hypot(shot.x-W*.18,shot.y-H*.67)/2)+'%'}});addEventListener('pointerup',e=>{if(!drag||!shot)return;let sx=W*.18,sy=H*.67,dx=sx-e.clientX,dy=sy-e.clientY;shot={x:sx,y:sy,vx:dx*.085,vy:dy*.085,flying:true};drag=0;shots++;pow.style.width='0%';save()});loop(0);</script></body></html>
