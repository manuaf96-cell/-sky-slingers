x;height:15px;background:#080b13dd;border:1px solid #ffffff22;border-radius:20px;display:none;z-index:3;overflow:hidden}.boss i{display:block;height:100%;background:linear-gradient(90deg,#ff315f,#ff9b5c);box-shadow:0 0 14px #f55}.toast{position:fixed;top:20%;left:50%;transform:translate(-50%,-10px);background:#101b35ef;border:1px solid #ffffff22;padding:11px 16px;border-radius:18px;opacity:0;z-index:9;transition:.18s;box-shadow:0 10px 30px #0007}.toast.on{opacity:1;transform:translate(-50%,0)}</style><body><canvas id=c></canvas><div class=hud><div class=pill id=stats></div><div class=pill id=lv></div></div><div class=boss id=bb><i></i></div><div class=power><i id=pow></i></div><button class=skill id=skill>⚡ ABILITÀ</button><button class=dodge id=dodge>💨 SCHIVATA</button><div id=toast class=toast></div><div id=menu class=panel><div class=card><div style="font-size:58px;filter:drop-shadow(0 0 20px #7df)">☁️</div><h1>Sky Slingers</h1><p>V64 · 60 livelli · 25 armi · abilità uniche</p><button id=play>🚀 GIOCA</button><button class=dark id=heroes>EROI</button><button class=dark id=weapons>ARMI</button><button class=dark id=gacha>GACHA</button><button class=dark id=map>MAPPA</button><button class=dark id=forge>FORGIA</button><button class=dark id=missions>MISSIONI</button><button class=dark id=ach>OBIETTIVI</button><button class=dark id=shop>NEGOZIO</button><p class=small>Ogni arma ora ha un effetto speciale: vento, gelo, fuoco, vuoto, fulmine e altro.</p></div></div><div id=sub class="panel hidden"><div class=card><div id=content></div><button class=dark id=back>INDIETRO</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),S=localStorage,K='skySlingers60';let W,H,drag=0,shot=null,objs=[],parts=[],stars=[],level=1,coins=500,gems=300,score=0,lives=3,hero=0,weapon=0,wxp=0,wlv=1,combo=0,skillCd=0,dodgeCd=0,inv=0,t=0,forge=0,treasures=0,kills=0,bosses=0,shots=0,shake=0,weaponPower=0;const Hs=[['Lampo',3,'Fulmine'],['Nova',3,'Esplosione'],['Astra',4,'Tempesta'],['Riven',4,'Ombra'],['Drakon',5,'Furia del Drago'],['Lyra',4,'Luna'],['Kairo',5,'Raggio Cosmico'],['Vega',5,'Supernova']];const Ws=[['Spada del Vento','🌪️',1,'Turbine'],['Arco Solare','☀️',1.2,'Raggio'],['Daga del Crepuscolo','🌒',1.1,'Ombra'],['Martello Titanico','🔨',1.6,'Stordisci'],['Lancia Stellare','✨',1.35,'Stella'],['Falce del Drago','🐉',1.8,'Fiamma'],['Arco del Tuono','⚡',1.55,'Catena'],['Spada Lunare','🌙',2,'Luna'],['Bastone Astrale','🔮',1.45,'Nova'],['Pugno Meteora','☄️',1.7,'Meteora'],['Katana Cremisi','🩸',1.9,'Sanguinamento'],['Arco Glaciale','❄️',1.5,'Gelo'],['Ascia Vulcanica','🌋',2.1,'Esplosione'],['Lama del Vuoto','🕳️',2.2,'Vuoto'],['Corona Celeste','👑',2.4,'Benedizione'],['Lama Solare','🔥',2,'Brucia'],['Arco Nebulare','🌌',2.3,'Nebbia'],['Martello Galattico','💫',2.5,'Onda'],['Falce Spettrale','👻',2.25,'Spiriti'],['Lancia del Fulmine','⚡',2.35,'Saetta'],['Spada Prismatica','🌈',2.55,'Prisma'],['Arco dell’Aurora','🌅',2.45,'Aurora'],['Pugno del Titano','🗿',2.7,'Terremoto'],['Lama Celestiale','🪽',2.8,'Ali'],['Cuore del Drago','❤️‍🔥',3,'Drago']];const effects=['Turbine','Raggio','Ombra','Stordisci','Stella','Fiamma','Catena','Luna','Nova','Meteora','Sanguinamento','Gelo','Esplosione','Vuoto','Benedizione','Brucia','Nebbia','Onda','Spiriti','Saetta','Prisma','Aurora','Terremoto','Ali','Drago'];function load(){try{let z=JSON.parse(S.getItem(K)||'{}');Object.assign(window,{level:z.level||1,coins:z.coins??500,gems:z.gems??300,score:z.score||0,hero:z.hero||0,weapon:Math.min(z.weapon||0,24),wxp:z.wxp||0,wlv:z.wlv||1,forge:z.forge||0,treasures:z.treasures||0,kills:z.kills||0,bosses:z.bosses||0,shots:z.shots||0})}catch(e){}}function save(){S.setItem(K,JSON.stringify({level,coins,gems,score,hero,weapon,wxp,wlv,forge,treasures,kills,bosses,shots}))}function resize(){W=c.width=innerWidth;H=c.height=innerHeight;if(!stars.length)for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.8+.3,a:Math.random()})}addEventListener('resize',resize);resize();load();function ui(){stats.textContent=`❤️${lives} 🪙${coins} 💎${gems} ⭐${score}`;lv.textContent=`Lv${level}/60 · ${Ws[weapon][0]} · 🔥${combo}`}function toast(a){let z=document.getElementById('toast');z.textContent=a;z.classList.add('on');setTimeout(()=>z.classList.remove('on'),1000)}function sling(){return{x:W*.18,y:H*.67}}function chapter(){return Math.ceil(level/10)}function newLevel(){objs=[];let n=Math.min(10,2+Math.floor(level/3));for(let i=0;i<n;i++){let kind=i%5;objs.push({t:kind===4?'f':'e',kind,x:W*(.46+i*.052),y:H*(.22+(i%4)*.13),hp:(1+level*.17)*(i%4===3?2.1:1),max:(1+level*.17)*(i%4===3?2.1:1),elite:i%4===3&&level>4,cd:70+i*9})}if(level%3===0)objs.push({t:'b',x:W*.78,y:H*.34,hp:18+level*3,m:18+level*3,phase:1,cd:80});if(level%5===0)objs.push({t:'q',x:W*.63,y:H*.57,w:70,h:28,hp:2});ui();toast(`☁️ Capitolo ${chapter()} · Livello ${level}`)}function burst(a,b,ch,n=14){for(let i=0;i<n;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:26+Math.random()*18,ch,s:12+Math.random()*12})}function xp(n){wxp+=n;let need=40+wlv*32;while(wxp>=need&&wlv<30){wxp-=need;wlv++;coins+=10;toast('⚔️ Arma Lv '+wlv);need=40+wlv*32}save()}function finish(){shot=null;drag=0;setTimeout(()=>{if(objs.some(o=>o.t==='e'||o.t==='f'||o.t==='b')){lives--;combo=0;if(lives<=0){lives=3;level=Math.max(1,level-2);toast('💥 Sconfitta: -2 livelli')}}else{if(level<60){level++;coins+=10;gems+=20}else{toast('🏆 CAMPAGNA V60 COMPLETATA!');gems+=100}}save();newLevel()},300)}function hit(o,p){if(o.t==='b')return Math.hypot(p.x-o.x,p.y-o.y)<50+p.r;if(o.t==='e'||o.t==='f')return Math.hypot(p.x-o.x,p.y-o.y)<(o.elite?30:24)+p.r;return p.x>o.x-o.w/2-p.r&&p.x<o.x+o.w/2+p.r&&p.y>o.y-o.h/2-p.r&&p.y<o.y+o.h/2+p.r}function weaponEffect(o,dmg){let e=effects[weapon];if(e==='Gelo'){o.slow=80;dmg*=1.15;toast('❄️ NEMICO CONGELATO')}if(e==='Stordisci'){o.stun=55;toast('🔨 STORDITO')}if(e==='Sanguinamento'){o.bleed=100;dmg*=1.1}if(e==='Brucia'){o.burn=100;dmg*=1.12}if(e==='Vuoto'){dmg*=1.22}if(e==='Catena'){objs.filter(q=>q!==o&&(q.t==='e'||q.t==='f')&&Math.hypot(q.x-o.x,q.y-o.y)<120).forEach(q=>{q.hp-=dmg*.35;burst(q.x,q.y,'⚡',8)})}if(e==='Turbine'){o.x+=18;if(o.x>W-70)o.x=W-70}if(e==='Meteora'){burst(o.x,o.y,'☄️',24);dmg*=1.18}if(e==='Esplosione'||e==='Onda'||e==='Terremoto'){objs.filter(q=>q!==o&&(q.t==='e'||q.t==='f')&&Math.hypot(q.x-o.x,q.y-o.y)<105).forEach(q=>q.hp-=dmg*.45);burst(o.x,o.y,'💥',22)}if(e==='Fiamma'||e==='Drago'){dmg*=1.3;burst(o.x,o.y,'🔥',12)}if(e==='Stella'||e==='Prisma'||e==='Aurora'){dmg*=1.18;gems+=1}if(e==='Benedizione'||e==='Ali'){dmg*=1.1;inv=Math.max(inv,12)}if(e==='Spiriti'||e==='Nebbia'){dmg*=1.12}if(e==='Saetta'){dmg*=1.25;burst(o.x,o.y,'⚡',12)}return dmg}function skillUse(){if(skillCd)return;let h=Hs[hero],mult=h[1]===5?3.2:h[1]===4?2.6:2.1;objs.filter(o=>o.t==='e'||o.t==='f'||o.t==='b').forEach(o=>{o.hp-=Ws[weapon][2]*mult*(1+forge*.05);burst(o.x,o.y,Ws[weapon][1],20)});skillCd=170;combo+=2;shake=7;ui()}function dodgeUse(){if(dodgeCd)return;inv=50;dodgeCd=105;toast('💨 SCHIVATA PERFETTA');burst(sling().x,sling().y,'💨',10)}play.onclick=()=>{menu.classList.add('hidden');newLevel()};skill.onclick=skillUse;dodge.onclick=dodgeUse;function show(q){sub.classList.remove('hidden');if(q==='heroes')content.innerHTML='<h1>👤 EROI</h1>'+Hs.map((h,i)=>`<div class=item><b>${h[0]} · ${'★'.repeat(h[1])}</b><span class=small>${h[2]}</span><br><button onclick="sh(${i})">${hero===i?'SELEZIONATO':'USA'}</button></div>`).join('');if(q==='weapons')content.innerHTML='<h1>⚔️ ARMI · 25</h1>'+Ws.map((w,i)=>`<div class=item><b>${w[1]} ${w[0]} · ${i+1}</b><span class=small>Potenza ${w[2].toFixed(2)} · Abilità: ${w[3]}</span><br><button onclick="sw(${i})">USA</button></div>`).join('');if(q==='map')content.innerHTML='<h1>🗺️ MAPPA · 60</h1>'+Array.from({length:60},(_,i)=>`<span style="display:inline-flex;width:42px;height:42px;margin:3px;border-radius:50%;align-items:center;justify-content:center;background:${i+1<=level?'#496b49':'#29375f'}">${i+1}</span>`).join('');if(q==='forge')content.innerHTML=`<h1>🔨 FORGIA</h1><p>${Ws[weapon][1]} ${Ws[weapon][0]}</p><p>Forgia +${forge} · danno +${forge*5}%</p><button onclick="up()">POTENZIA · ${150*(forge+1)} 🪙</button>`;if(q==='gacha')content.innerHTML=`<h1>🎲 GACHA</h1><p>💎 ${gems}</p><button onclick="pull(1)">100 💎</button><button onclick="pull(10)">900 💎</button><p class=small>75% ★3 · 20% ★4 · 5% ★5</p><div id=res></div>`;if(q==='missions')content.innerHTML=`<h1>🎯 MISSIONI</h1><div class=item>Colpisci 20 nemici · ${kills%20}/20<br><button onclick="claim(50)">RISCATTA 50 💎</button></div><div class=item>Sconfiggi 3 boss · ${bosses%3}/3<br><button onclick="claim(100)">RISCATTA 100 💎</button></div><div class=item>Effettua 50 tiri · ${shots%50}/50<br><button onclick="claim(75)">RISCATTA 75 💎</button></div>`;if(q==='ach')content.innerHTML=`<h1>🏆 OBIETTIVI</h1><div class=item>⚔️ Cacciatore · ${kills} eliminazioni</div><div class=item>👑 Re dei Boss · ${bosses} boss</div><div class=item>🎁 Tesori · ${treasures}</div><div class=item>🌟 Progresso · livello ${level}/60</div>`;if(q==='shop')content.innerHTML=`<h1>🛒 NEGOZIO</h1><div class=item>💎 100 gemme → 500 🪙<br><button onclick="buy()">COMPRA</button></div><div class=item>❤️ +1 vita → 150 🪙<br><button onclick="buyLife()">COMPRA</button></div>`}window.sh=i=>{hero=i;save();show('heroes')};window.sw=i=>{weapon=i;wxp=0;wlv=1;forge=0;save();show('weapons');toast('⚔️ '+Ws[i][0])};window.up=()=>{let cost=150*(forge+1);if(coins<cost)return toast('Monete insufficienti');coins-=cost;forge++;save();show('forge');ui()};window.pull=n=>{let cost=n===10?900:100;if(gems<cost)return toast('Gemme insufficienti');gems-=cost;let out=[];for(let j=0;j<n;j++){let r=Math.random()<.05?5:Math.random()<.25?4:3,a=Ws.filter(w=>(w[3]||5)>=r),w=a[Math.random()*a.length|0];weapon=Ws.indexOf(w);out.push(w[1]+' '+w[0])}document.getElementById('res').innerHTML='<div class=item>'+out.join('<br>')+'</div>';save();ui()};window.claim=n=>{gems+=n;save();s
