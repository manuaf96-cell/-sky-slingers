<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sky Slingers V67</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071126;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}button{border:1px solid #ffffff26;border-radius:16px;padding:11px 15px;margin:4px;font-weight:900;color:#fff;background:linear-gradient(180deg,#526da8,#30456f);box-shadow:0 5px 16px #0006}button:active{transform:scale(.96)}.dark{background:#172643}.hud{position:fixed;top:7px;left:0;right:0;display:flex;justify-content:space-between;padding:7px;z-index:3;pointer-events:none}.pill{background:#101b35d9;border:1px solid #ffffff24;border-radius:18px;padding:9px 11px;box-shadow:0 5px 18px #0005}.panel{position:fixed;inset:0;background:#050b18e8;display:flex;align-items:center;justify-content:center;z-index:6}.card{width:min(94vw,560px);max-height:91vh;overflow:auto;text-align:center;background:linear-gradient(145deg,#172747f5,#0c1830f5);border:1px solid #ffffff25;border-radius:28px;padding:20px;box-shadow:0 20px 70px #000b}.card h1{font-size:34px;margin:5px 0 8px;text-shadow:0 4px 20px #6be3ff88}.hidden{display:none!important}.skill,.dodge,.audio{position:fixed;bottom:17px;z-index:4}.skill{right:7px}.dodge{left:7px}.audio{right:50%;transform:translateX(50%);bottom:8px;padding:7px 11px;font-size:12px}.power{position:fixed;left:27%;bottom:30px;width:46%;height:11px;background:#08101fcc;border:1px solid #ffffff22;border-radius:20px;overflow:hidden;z-index:4}.power i{display:block;height:100%;background:linear-gradient(90deg,#61d8ff,#fff36b);width:0}.boss{position:fixed;left:10%;right:10%;top:59px;height:15px;background:#080b13dd;border:1px solid #ffffff22;border-radius:20px;display:none;z-index:3;overflow:hidden}.boss i{display:block;height:100%;background:linear-gradient(90deg,#ff315f,#ff9b5c)}.toast{position:fixed;top:20%;left:50%;transform:translate(-50%,-10px);background:#101b35ef;border:1px solid #ffffff22;padding:11px 16px;border-radius:18px;opacity:0;z-index:9;transition:.18s}.toast.on{opacity:1;transform:translate(-50%,0)}</style><body><canvas id=c></canvas><div class=hud><div class=pill id=stats></div><div class=pill id=lv></div></div><div class=boss id=bb><i></i></div><div class=power><i id=pow></i></div><button class=skill id=skill>⚡ ABILITÀ</button><button class=dodge id=dodge>💨 SCHIVATA</button><button class=audio id=audio>🔊 AUDIO</button><div id=toast class=toast></div><div id=menu class=panel><div class=card><div style="font-size:58px">☁️</div><h1>Sky Slingers</h1><p>V67 · 60 livelli · 25 armi · Colonna sonora dinamica</p><button id=play>🚀 GIOCA</button><button class=dark id=heroes>EROI</button><button class=dark id=weapons>ARMI</button><button class=dark id=gacha>GACHA</button><button class=dark id=map>MAPPA</button><button class=dark id=forge>FORGIA</button><button class=dark id=missions>MISSIONI</button><button class=dark id=shop>NEGOZIO</button><p class=small>🎵 Musica normale, musica boss, fanfare e effetti di combattimento.</p></div></div><div id=sub class="panel hidden"><div class=card><div id=content></div><button class=dark id=back>INDIETRO</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),K='skySlingers60';let W,H,drag=0,shot=null,objs=[],parts=[],stars=[],level=1,coins=500,gems=300,score=0,lives=3,hero=0,weapon=0,wxp=0,wlv=1,combo=0,skillCd=0,dodgeCd=0,inv=0,forge=0,treasures=0,kills=0,bosses=0,shots=0,shake=0,AC=null,musicGain=null,musicTimer=null,sound=1,musicOn=1,beat=0;const Hs=[['Lampo',3,'Fulmine'],['Nova',3,'Esplosione'],['Astra',4,'Tempesta'],['Riven',4,'Ombra'],['Drakon',5,'Furia del Drago'],['Lyra',4,'Luna'],['Kairo',5,'Raggio Cosmico'],['Vega',5,'Supernova']];const Ws=[['Spada del Vento','🌪️',1,'Turbine'],['Arco Solare','☀️',1.2,'Raggio'],['Daga del Crepuscolo','🌒',1.1,'Ombra'],['Martello Titanico','🔨',1.6,'Stordisci'],['Lancia Stellare','✨',1.35,'Stella'],['Falce del Drago','🐉',1.8,'Fiamma'],['Arco del Tuono','⚡',1.55,'Catena'],['Spada Lunare','🌙',2,'Luna'],['Bastone Astrale','🔮',1.45,'Nova'],['Pugno Meteora','☄️',1.7,'Meteora'],['Katana Cremisi','🩸',1.9,'Sanguinamento'],['Arco Glaciale','❄️',1.5,'Gelo'],['Ascia Vulcanica','🌋',2.1,'Esplosione'],['Lama del Vuoto','🕳️',2.2,'Vuoto'],['Corona Celeste','👑',2.4,'Benedizione'],['Lama Solare','🔥',2,'Brucia'],['Arco Nebulare','🌌',2.3,'Nebbia'],['Martello Galattico','💫',2.5,'Onda'],['Falce Spettrale','👻',2.25,'Spiriti'],['Lancia del Fulmine','⚡',2.35,'Saetta'],['Spada Prismatica','🌈',2.55,'Prisma'],['Arco dell’Aurora','🌅',2.45,'Aurora'],['Pugno del Titano','🗿',2.7,'Terremoto'],['Lama Celestiale','🪽',2.8,'Ali'],['Cuore del Drago','❤️‍🔥',3,'Drago']];function load(){try{Object.assign(window,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}}function save(){localStorage.setItem(K,JSON.stringify({level,coins,gems,score,hero,weapon,wxp,wlv,forge,treasures,kills,bosses,shots}))}function resize(){W=c.width=innerWidth;H=c.height=innerHeight;if(!stars.length)for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.8+.3})}addEventListener('resize',resize);resize();load();function tone(f,d=.08,type='sine',v=.05,slide=1){if(!sound||!AC)return;let o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(35,f*slide),n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(AC.destination);o.start();o.stop(n+d+.03)}function audioInit(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(!musicTimer)startMusic()}function startMusic(){if(!AC||!musicOn)return;clearInterval(musicTimer);let boss=level%3===0;let scale=boss?[110,131,147,165,196,220,247,262]:[196,220,247,294,330,392,440,392];beat=0;musicTimer=setInterval(()=>{if(!sound||!musicOn)return;let f=scale[beat%scale.length];tone(f,.18,boss?'sawtooth':'triangle',boss?.025:.018,1);if(beat%4===0)tone(f/2,.22,'sine',boss?.018:.012,.99);beat++},boss?230:330)}function sfx(n){audioInit();if(n==='launch')tone(220,.12,'triangle',.06,2.1);if(n==='hit')tone(130,.07,'square',.045,.7);if(n==='crit'){tone(440,.12,'sawtooth',.07,1.8);setTimeout(()=>tone(700,.14,'triangle',.05,.8),50)}if(n==='boom'){tone(90,.35,'sawtooth',.1,.35);setTimeout(()=>tone(55,.25,'square',.06,.5),70)}if(n==='boss'){startMusic();tone(110,.4,'sawtooth',.08,.5);setTimeout(()=>tone(165,.35,'sawtooth',.07,.5),180)}if(n==='skill'){tone(330,.18,'triangle',.07,2);setTimeout(()=>tone(660,.28,'sine',.06,.7),90)}if(n==='dodge')tone(700,.12,'triangle',.05,.45);if(n==='coin'){tone(880,.08,'square',.05,1.35);setTimeout(()=>tone(1320,.1,'square',.045,1),70)}if(n==='win')[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.07,.98),i*110));if(n==='lose'){tone(220,.3,'sawtooth',.07,.45);setTimeout(()=>tone(130,.35,'sawtooth',.06,.45),150)}}function toggleAudio(){sound=!sound;musicOn=sound;audio.textContent=sound?'🔊 AUDIO':'🔇 AUDIO';if(sound){audioInit();startMusic();sfx('coin')}else clearInterval(musicTimer)}function ui(){stats.textContent=`❤️${lives} 🪙${coins} 💎${gems} ⭐${score}`;lv.textContent=`Lv${level}/60 · ${Ws[weapon][0]} · 🔥${combo}`}function toast(a){let z=document.getElementById('toast');z.textContent=a;z.classList.add('on');setTimeout(()=>z.classList.remove('on'),1000)}function sling(){return{x:W*.18,y:H*.67}}function burst(a,b,ch,n=14){for(let i=0;i<n;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:26+Math.random()*18,ch,s:12+Math.random()*12})}function newLevel(){objs=[];combo=0;let n=Math.min(10,2+Math.floor(level/3));for(let i=0;i<n;i++)objs.push({t:i%5===4?'f':'e',x:W*(.46+i*.052),y:H*(.22+(i%4)*.13),hp:(1+level*.17)*(i%4===3?2.1:1),max:(1+level*.17)*(i%4===3?2.1:1),elite:i%4===3&&level>4,cd:70+i*9});if(level%3===0){objs.push({t:'b',x:W*.78,y:H*.34,hp:18+level*3,m:18+level*3,phase:1});sfx('boss');toast('👑 BOSS!');}if(level%5===0)objs.push({t:'q',x:W*.63,y:H*.57,w:70,h:28,hp:2});ui();startMusic()}function fire(){if(!shot||shot.done)return;let o=objs.find(o=>o.t==='b'||o.t==='e'||o.t==='f'||o.t==='q');if(!o)return;let d=Ws[weapon][2]*(1+forge*.04)*(Hs[hero][1]/3)*(wlv*.035+1);if(Math.random()<.12){d*=1.8;sfx('crit')}else sfx('hit');if(o.t==='q'){o.hp=0;treasures++;gems+=30;coins+=30;sfx('coin');burst(o.x,o.y,'💎',25)}else{o.hp-=d;combo++;score+=Math.ceil(d);kills+=o.hp<=0?1:0;if(o.hp<=0){xp(10);burst(o.x,o.y,'💥',18);sfx('boom')}}shot=null;drag=0;save();ui();setTimeout(checkFinish,220)}function xp(n){wxp+=n;let need=40+wlv*32;while(wxp>=need&&wlv<30){wxp-=need;wlv++;coins+=10;sfx('coin');toast('⚔️ Arma Lv '+wlv);need=40+wlv*32}save()}function checkFinish(){if(objs.some(o=>o.hp>0&&(o.t==='e'||o.t==='f'||o.t==='b'||o.t==='q')))return;if(level<60){level++;coins+=10;gems+=20;sfx('win');save();newLevel()}else{gems+=100;sfx('win');toast('🏆 CAMPAGNA COMPLETATA!');save()}}function skillUse(){if(skillCd)return;skillCd=1;sfx('skill');objs.forEach(o=>{if(o.t!=='q')o.hp=0});burst(W*.72,H*.35,'⚡',35);setTimeout(()=>skillCd=0,3500);checkFinish()}function dodgeUse(){if(dodgeCd)return;dodgeCd=1;inv=80;sfx('dodge');setTimeout(()=>dodgeCd=0,3000)}function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#08193d');g.addColorStop(1,'#2573a1');x.fillStyle=g;x.fillRect(0,0,W,H);stars.forEach(s=>{x.globalAlpha=.5;x.fillStyle='#fff';x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,7);x.fill()});x.globalAlpha=1;x.fillStyle='#173b4d';x.fillRect(0,H*.78,W,H*.22);objs.forEach(o=>{if(o.hp<=0)return;x.save();x.translate(o.x,o.y);if(o.t==='b'){x.font='58px serif';x.fillText('👑',-30,20);bb.style.display='block';bb.querySelector('i').style.width=(100*o.hp/o.m)+'%'}else if(o.t==='q'){x.font='42px serif';x.fillText('🎁',-21,15)}else{x.font=o.elite?'42px serif':'34px serif';x.fillText(o.t==='f'?'👾':'👹',-20,12);if(o.elite){x.font='18px serif';x.fillText('⭐',-9,-24)}}x.restore()});let s=sling();x.strokeStyle='#e7c48a';x.lineWidth=6;x.beginPath();x.moveTo(s.x-16,s.y-20);x.lineTo(s.x,s.y);x.lineTo(s.x+16,s.y-20);x.stroke();if(shot){x.strokeStyle='#ffffff77';x.lineWidth=2;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(shot.x,shot.y);x.stroke();x.fillStyle='#ffe66b';x.beginPath();x.arc(shot.x,shot.y,9,0,7);x.fill()}parts.forEach(p=>{x.globalAlpha=Math.max(0,p.l/40);x.font=p.s+'px serif';x.fillText(p.ch,p.x,p.y)});x.globalAlpha=1;ui()}function update(){parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l--});parts=parts.filter(p=>p.l>0);if(shot){shot.x+=shot.vx;shot.y+=shot.vy;shot.vy+=.35;if(shot.x>W||shot.y>H||shot.y<0){shot=null;drag=0;setTimeout(checkFinish,220)}}}function loop(){update();draw();requestAnimationFrame(loop)}function openMenu(title,html){menu.classList.add('hidden');sub.classList.remove('hidden');content.innerHTML='<h2>'+title+'</h2>'+html}function closeMenu(){sub.classList.add('hidden');menu.classList.remove('hidden')}play.onclick=()=>{audioInit();menu.classList.add('hidden');newLevel()};audio.onclick=toggleAudio;skill.onclick=skillUse;dodge.onclick=dodgeUse;back.onclick=closeMenu;heroes.onclick=()=>openMenu('EROI',Hs.map((h,i)=>`<button onclick="hero=${i};closeMenu();save()">${h[0]} · ${h[2]} ⭐${h[1]}</button>`).join(''));weapons.onclick=()=>openMenu('ARMI',Ws.map((w,i)=>`<button onclick="weapon=${i};closeMenu();save()">${w[1]} ${w[0]} · ${w[3]} · x${w[2]}</button>`).join(''));gacha.onclick=()=>{gems=Math.max(0,gems-100);weapon=Math.floor(Math.random()*Ws.length);sfx('coin');save();openMenu('GACHA',`<h2>Hai trovato ${Ws[weapon][1]} ${Ws[weapon][0]}!</h2><p>Effetto: ${Ws[weapon][3]}</p>`) };map.onclick=()=>openMenu('MAPPA',`<p>Capitolo ${Math.ceil(level/10)} · Livello ${level}/60</p>`);forge.onclick=()=>{let cost=100*(forge+1);if(coins>=cost){coins-=cost;forge++;sfx('coin');save()}openMenu('FORGIA',`<p>Livello forgia: ${forge}</p><p>Danno +${forge*4}%</p><p>Costo prossimo: ${cost} 🪙</p><button onclick="coins>=${cost}&&(coins-=${cost},forge++,save(),closeMenu())">POTENZIA</button>`)};missions.onclick=()=>openMenu('MISSIONI',`<p>🎯 ${kills} nemici sconfitti</p><p>🎁 ${treasures} tesori aperti</p><p>🏹 ${shots} lanci</p>`);shop.onclick=()=>openMenu('NEGOZIO',`<p>🪙 ${coins} · 💎 ${gems}</p><button onclick="gems+=50;coins-=100;save();closeMenu()">Scambia 100 🪙 → 50 💎</button>`);addEventListener('pointerdown',e=>{if(menu.classList.contains('hidden')&&sub.classList.contains('hidden')){let s=sling();drag=1;shot={x:s.x,y:s.y,vx:0,vy:0};sfx('launch')}});addEventListener('pointermove',e=>{if(!drag||!shot)return;shot.x=e.clientX;shot.y=e.clientY;pow.style.width=Math.min(100,Math.hypot(shot.x-W*.18,shot.y-H*.67)/2)+'%'});addEventListener('pointerup',e=>{if(!drag||!shot)return;let s=sling(),dx=s.x-e.clientX,dy=s.y-e.clientY,scale=.085;shot={x:s.x,y:s.y,vx:dx*scale,vy:dy*scale};drag=0;shots++;fire()});loop();</script></body></html>
