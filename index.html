<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10152b"><title>Sky Slingers V10</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10152b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}button{border:0;border-radius:15px;padding:11px 14px;margin:4px;background:#fff;color:#10152b;font-weight:900;font-size:14px}.dark{background:#293452;color:#fff}.hud{position:fixed;top:env(safe-area-inset-top,8px);left:0;right:0;display:flex;justify-content:space-between;padding:9px 12px;pointer-events:none;text-shadow:0 2px 4px #000}.pill{background:#10152bcc;border:1px solid #fff3;border-radius:18px;padding:7px 10px;font-weight:800}.panel{position:fixed;inset:0;background:#10152bf2;display:flex;align-items:center;justify-content:center;z-index:5}.card{width:min(92vw,540px);max-height:90vh;overflow:auto;background:#18203b;border:1px solid #fff3;border-radius:24px;padding:20px;text-align:center;box-shadow:0 20px 70px #0009}.hidden{display:none!important}h1{margin:0 0 6px;font-size:36px}.sub{opacity:.75;margin-bottom:12px}.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.item{background:#222d4d;border-radius:14px;padding:9px;margin:5px;text-align:left}.item b{display:block}.small{font-size:12px;opacity:.72}.skill{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,12px) + 10px);z-index:3}.dodge{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,12px) + 10px);z-index:3}.power{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,12px) + 22px);transform:translateX(-50%);width:42%;height:10px;background:#10152b99;border-radius:9px;overflow:hidden}.power i{display:block;height:100%;width:0;background:#fff}.banner{position:fixed;left:50%;top:16px;transform:translateX(-50%);font-weight:1000;text-shadow:0 3px 7px #000;pointer-events:none}.boss{position:fixed;left:12%;right:12%;top:72px;height:12px;background:#111b;border:1px solid #fff4;border-radius:9px;overflow:hidden;display:none}.boss i{display:block;height:100%;background:#e33;width:100%}.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#10152bf0;padding:10px 15px;border-radius:15px;font-weight:900;opacity:0;transition:.2s;z-index:9}.toast.on{opacity:1}.warn{position:fixed;left:50%;top:27%;transform:translate(-50%,-50%);font-size:25px;font-weight:1000;text-shadow:0 4px 9px #000;opacity:0;z-index:4}.warn.on{animation:w 1s ease-out}@keyframes w{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}.reward{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#111827f5;border:1px solid #fff4;border-radius:20px;padding:18px;text-align:center;z-index:8;display:none}.reward.on{display:block}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill" id="stats"></div><div class="pill" id="lv"></div></div><div class="banner" id="banner"></div><div class="boss" id="bb"><i></i></div><div class="warn" id="warn">⚠️ ATTACCO BOSS ⚠️</div><div class="power"><i id="pow"></i></div><button class="skill" id="skill">⚡ ABILITÀ</button><button class="dodge" id="dodge">💨 SCHIVATA</button><div class="toast" id="toast"></div><div class="reward" id="reward"></div><div class="panel" id="menu"><div class="card"><h1>☁️ Sky Slingers</h1><div class="sub">V10 · 15 armi · Boss · Gacha · XP · Schivata</div><div class="row"><button id="play">GIOCA</button><button class="dark" id="heroes">EROI</button><button class="dark" id="weapons">ARMI</button><button class="dark" id="gacha">GACHA</button><button class="dark" id="map">MAPPA</button></div><p class="small">Nuova versione: 15 armi con elementi, rarità, potenza e passivi.</p></div></div><div class="panel hidden" id="subpanel"><div class="card"><div id="content"></div><button class="dark" id="back">INDIETRO</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),S=localStorage,k='skySlingers';let W,H,drag=0,aim={x:0,y:0},shot=null,objs=[],parts=[],level=1,coins=0,gems=300,score=0,lives=3,energy=100,combo=0,hero='lampo',weapon=0,wxp=0,wlv=1,skillCd=0,dodgeCd=0,inv=0,bossTick=0;const heroes=[{id:'lampo',n:'Lampo',r:3,skill:'Fulmine'},{id:'nova',n:'Nova',r:3,skill:'Esplosione'},{id:'astra',n:'Astra',r:4,skill:'Tempesta'},{id:'riven',n:'Riven',r:4,skill:'Ombra'},{id:'drakon',n:'Drakon',r:5,skill:'Furia del Drago'}];const weapons=[{n:'Spada del Vento',e:'🌪️',p:1,s:3,pass:'Combo +5%'},{n:'Arco Solare',e:'☀️',p:1.2,s:3,pass:'Crit +3%'},{n:'Daga del Crepuscolo',e:'🌒',p:1.1,s:3,pass:'Danno critico +25%'},{n:'Martello Titanico',e:'🔨',p:1.6,s:4,pass:'Stordimento'},{n:'Lancia Stellare',e:'✨',p:1.35,s:4,pass:'Boss +10%'},{n:'Falce del Drago',e:'🐉',p:1.8,s:5,pass:'Boss +20%'},{n:'Arco del Tuono',e:'⚡',p:1.55,s:5,pass:'Fulmine ad area'},{n:'Spada Lunare',e:'🌙',p:2,s:5,pass:'Crit +8%'},{n:'Bastone Astrale',e:'🔮',p:1.45,s:4,pass:'Skill +15%'},{n:'Pugno Meteora',e:'☄️',p:1.7,s:4,pass:'Impatto +12%'},{n:'Katana Cremisi',e:'🩸',p:1.9,s:5,pass:'Crit +10%'},{n:'Arco Glaciale',e:'❄️',p:1.5,s:4,pass:'Rallenta nemici'},{n:'Ascia Vulcanica',e:'🌋',p:2.1,s:5,pass:'Danno esplosivo'},{n:'Lama del Vuoto',e:'🕳️',p:2.2,s:5,pass:'Ignora 10% difesa'},{n:'Corona Celeste',e:'👑',p:2.4,s:5,pass:'Tutti i bonus +10%'}];function load(){try{let z=JSON.parse(S.getItem(k)||'{}');level=z.level||1;coins=z.coins||0;gems=z.gems??300;score=z.score||0;hero=z.hero||'lampo';weapon=Math.min(z.weapon||0,weapons.length-1);wxp=z.wxp||0;wlv=z.wlv||1}catch(e){}}function save(){S.setItem(k,JSON.stringify({level,coins,gems,score,hero,weapon,wxp,wlv}))}function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();load();function ui(){document.getElementById('stats').textContent=`❤️ ${lives}  🪙 ${coins}  💎 ${gems}  ⭐ ${score}`;document.getElementById('lv').textContent=`Lv ${level} · ${weapons[weapon].n} Lv${wlv}`;document.getElementById('banner').textContent=`CAPITOLO ${Math.ceil(level/3)} · LIVELLO ${level}`;document.getElementById('skill').textContent=skillCd?'⏳':'⚡ '+(heroes.find(h=>h.id===hero)?.skill||'ABILITÀ');document.getElementById('dodge').textContent=dodgeCd?'💨 ⏳':'💨 SCHIVATA'}function sling(){return{x:W*.18,y:H*.67}}function newLevel(){objs=[];let boss=level%3===0;for(let i=0;i<Math.min(6,2+Math.floor(level/2));i++)objs.push({t:'e',x:W*(.52+i*.075),y:H*(.3+(i%2)*.2),hp:1+level*.13});if(boss)objs.push({t:'b',x:W*.78,y:H*.35,hp:10+level*2,m:10+level*2,p:1});for(let i=0;i<2;i++)objs.push({t:'q',x:W*(.48+i*.16),y:H*.62,w:60,h:22,hp:2});ui()}function toast(t){let z=document.getElementById('toast');z.textContent=t;z.classList.add('on');setTimeout(()=>z.classList.remove('on'),900)}function burst(px,py,ch){for(let i=0;i<7;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,l:28,ch})}function fx(px,py,t){let z=document.createElement('div');z.textContent=t;z.style.cssText=`position:fixed;left:${px}px;top:${py}px;font-weight:1000;font-size:22px;z-index:7`;document.body.appendChild(z);setTimeout(()=>z.remove(),500)}function hit(o,p){if(o.t==='b')return Math.hypot(p.x-o.x,p.y-o.y)<48+p.r;if(o.t==='e')return Math.hypot(p.x-o.x,p.y-o.y)<23+p.r;return p.x>o.x-o.w/2-p.r&&p.x<o.x+o.w/2+p.r&&p.y>o.y-o.h/2-p.r&&p.y<o.y+o.h/2+p.r}function addxp(n){wxp+=n;let need=45+wlv*30;while(wxp>=need&&wlv<20){wxp-=need;wlv++;toast('⚔️ '+weapons[weapon].n+' Lv '+wlv);need=45+wlv*30}save()}function start(){document.getElementById('menu').classList.add('hidden');newLevel();ui()}function endShot(){shot=null;drag=0;setTimeout(()=>{if(objs.some(o=>o.t==='e'||o.t==='b')){lives--;combo=0;if(lives<=0){toast('Game Over');lives=3;level=1;score=0;coins=0;gems=300}}else{level++;coins+=5;gems+=25;energy=100}save();newLevel()},450)}function useSkill(){if(skillCd)return;let h=heroes.find(a=>a.id===hero)||heroes[0],m=h.r===5?3:h.r===4?2.5:2;let bonus=weapons[weapon].pass.includes('Skill')?1.15:1;objs.filter(o=>o.t==='e'||o.t==='b').forEach(o=>{o.hp-=weapons[weapon].p*m*bonus;burst(o.x,o.y,'✨');fx(o.x,o.y,'SKILL!')});skillCd=180;energy=Math.max(0,energy-30);combo+=2;ui()}function dodge(){if(dodgeCd)return;inv=45;dodgeCd=100;toast('💨 SCHIVATA!');ui()}document.getElementById('play').onclick=start;document.getElementById('skill').onclick=useSkill;document.getElementById('dodge').onclick=dodge;function show(type){let p=document.getElementById('subpanel'),q=document.getElementById('content');p.classList.remove('hidden');if(type==='heroes')q.innerHTML='<h1>👤 EROI</h1>'+heroes.map(h=>`<div class="item"><b>${h.n} · ${'★'.repeat(h.r)}</b><span class="small">Abilità: ${h.skill}</span><br><button onclick="selHero('${h.id}')">${hero===h.id?'SELEZIONATO':'USA'}</button></div>`).join('');if(type==='weapons')q.innerHTML='<h1>⚔️ ARMI · 15</h1>'+weapons.map((w,i)=>`<div class="item"><b>${w.e} ${w.n} · ${'★'.repeat(w.s)}</b><span class="small">Potenza ${w.p.toFixed(1)} · ${w.pass}${i===weapon?' · EQUIPAGGIATA':''}</span><br><button onclick="selWeapon(${i})">USA</button></div>`).join('');if(type==='gacha')q.innerHTML=`<h1>🎲 GACHA</h1><p>💎 ${gems}</p><p class="small">Singola 100 💎 · x10 900 💎 · 75% ★3 · 20% ★4 · 5% ★5</p><button onclick="pull(1)">ESTRAI 1</button><button onclick="pull(10)">ESTRAI 10</button><div id="res"></div>`;if(type==='map')q.innerHTML='<h1>🗺️ CAMPAGNA</h1>'+Array.from({length:20},(_,i)=>`<span style="display:inline-flex;width:48px;height:48px;margin:4px;border-radius:50%;align-items:center;justify-content:center;background:${i+1<=level?'#496b49':'#29375f'}">${i+1}</span>`).join('')}window.selHero=id=>{hero=id;save();show('heroes');ui()};window.selWeapon=i=>{weapon=i;wxp=0;wlv=1;save();show('weapons');ui();toast('⚔️ '+weapons[i].n+' equipaggiata')};window.pull=n=>{let cost=n===10?900:100;if(gems<cost){toast('Gemme insufficienti');return}gems-=cost;let out=[];for(let j=0;j<n;j++){let r=Math.random()<.05?5:Math.random()<.25?4:3;let pool=weapons.filter(w=>w.s===r);let w=pool[Math.floor(Math.random()*pool.length)];let i=weapons.indexOf(w);out.push(`${w.e} ${w.n} · ★${w.s}`);if(j===n-1){weapon=i;wxp=0;wlv=1}}document.getElementById('res').innerHTML='<div class="item">'+out.join('<br>')+'</div>';save();ui()};document.getElementById('heroes').onclick=()=>show('heroes');document.getElementById('weapons').onclick=()=>show('weapons');document.getElementById('gacha').onclick=()=>show('gacha');document.getElementById('map').onclick=()=>show('map');document.getElementById('back').onclick=()=>document.getElementById('subpanel').classList.add('hidden');c.addEventListener('pointerdown',e=>{if(shot)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling();if(Math.hypot(p.x-s.x,p.y-s.y)<95){drag=1;aim=p;c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(!drag)return;let r=c.getBoundingClientRect();aim={x:e.clientX-r.left,y:e.clientY-r.top};let s=sling(),d=Math.min(150,Math.hypot(aim.x-s.x,aim.y-s.y));document.getElementById('pow').style.width=d/150*100+'%'});c.addEventListener('pointerup',e=>{if(!drag)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling(),dx=s.x-p.x,dy=s.y-p.y,d=Math.hypot(dx,dy);drag=0;document.getElementById('pow').style.width='0';if(d<12)return;let kk=Math.min(d,150)/17;shot={x:s.x,y:s.y,vx:dx/d*kk,vy:dy/d*kk,r:16}});function update(){energy=Math.min(100,energy+.04);if(skillCd)skillCd--;if(dodgeCd)dodgeCd--;if(inv)inv--;if(!shot)return;shot.vy+=.2;shot.x+=shot.vx;shot.y+=shot.vy;for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(hit(o,shot)){let dmg=weapons[weapon].p*(1+Math.min(combo,10)*.04);if(hero==='drakon'&&o.t==='b')dmg*=1.5;if(weapons[weapon].pass.includes('Boss')&&o.t==='b')dmg*=1.1;if(weapons[weapon].pass.includes('difesa'))dmg*=1.1;if(weapons[weapon].pass.includes('Crit')&&Math.random()<.12)dmg*=2;else if(Math.random()<.08)dmg*=2;o.hp-=dmg;shot.vx*=.7;shot.vy*=.7;combo++;score+=o.t==='b'?50:10;coins+=o.t==='b'?20:1;addxp(o.t==='b'?40:7);burst(o.x,o.y,weapons[weapon].e);fx(o.x,o.y,'-'+Math.round(dmg));if(o.hp<=0){if(o.t==='b'){gems+=20+level*3;coins+=30;document.getElementById('reward').innerHTML=`<h2>🏆 BOSS SCONFITTO!</h2><p>💎 +${20+level*3} · 🪙 +30</p><button onclick="document.getElementById('reward').classList.remove('on')">CONTINUA</button>`;document.getElementById('reward').classList.add('on')}objs.splice(i,1)}if(Math.hypot(shot.vx,shot.vy)<1.1){endShot();break}}}if(shot&&(shot.x>W+80||shot.y>H+80||shot.x<-80))endShot();let b=objs.find(o=>o.t==='b');if(b){document.getElementById('bb').style.display='block';document.querySelector('#bb i').style.width=Math.max(0,b.hp/b.m*100)+'%';bossTick++;if(bossTick%100===0){let w=document.getElementById('warn');w.classList.remove('on');void w.offsetWidth;w.classList.add('on');if(inv<=0){lives=Math.max(1,lives-1);ui()}}}else document.getElementById('bb').style.display='none';ui()}function draw(){x.clearRect(0,0,W,H);let sky=level%3===0?'#405d99':level>6?'#28365f':'#54c7ff';x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle=level%3===0?'#3f465e':'#70b85a';x.fillRect(0,H*.72,W,H*.28);let s=sling();x.strokeStyle='#633d24';x.lineWidth=9;x.beginPath();x.moveTo(s.x-12,s.y+48);x.lineTo(s.x,s.y);x.lineTo(s.x+18,s.y+48);x.stroke();if(drag){x.strokeStyle='#432719';x.lineWidth=4;x.beginPath();x.moveTo(s.x-3,s.y);x.lineTo(aim.x,aim.y);x.lineTo(s.x+11,s.y);x.stroke()}objs.forEach(o=>{x.save();x.translate(o.x,o.y);if(o.t==='e'){x.fillStyle='#e55353';x.beginPath();x.arc(0,0,19,0,7);x.fill();x.fillStyle='#fff';x.fillRect(-8,-6,6,7);x.fillRect(3,-6,6,7)}else if(o.t==='q'){x.fillStyle='#a96b3c';x.fillRect(-o.w/2,-o.h/2,o.w,o.h)}else{x.fillStyle='#713d91';x.beginPath();x.arc(0,0,45,0,7);x.fill();x.fillStyle='#fff';x.font='bold 18px sans-serif';x.textAlign='center';x.fillText(o.p===2?'FURIA':'BOSS',0,6)}x.restore()});parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l--;x.globalAlpha=p.l/28;x.font='18px sans-serif';x.fillText(p.ch,p.x,p.y)});x.globalAlpha=1;if(shot){x.fillStyle='#ffcc33';x.beginPath();x.arc(shot.x,shot.y,shot.r,0,7);x.fill();x.font='21px sans-serif';x.textAlign='center';x.fillText(weapons[weapon].e,shot.x,shot.y+7)}if(!shot&&!drag){x.font='34px sans-serif';x.textAlign='center';x.fillText(heroes.find(h=>h.id===hero)?.n==='Nova'?'👩':'🧙',s.x,s.y+12)}}function loop(){update();draw();requestAnimationFrame(loop)}ui();loop()</script></body></html>
