<!doctype html><html lang=it><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sky Slingers V60</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0d1226;color:#fff;font-family:system-ui;touch-action:none}canvas{width:100%;height:100%;display:block}button{border:0;border-radius:14px;padding:10px 13px;margin:4px;font-weight:900}.dark{background:#293452;color:#fff}.hud{position:fixed;top:6px;left:0;right:0;display:flex;justify-content:space-between;padding:7px;z-index:3}.pill,.card{background:#18203bf2;border:1px solid #fff3;border-radius:18px;padding:9px}.panel{position:fixed;inset:0;background:#0d1226f5;display:flex;align-items:center;justify-content:center;z-index:6}.card{width:min(94vw,560px);max-height:91vh;overflow:auto;text-align:center}.hidden{display:none!important}.item{background:#222d4d;border-radius:13px;padding:9px;margin:5px;text-align:left}.small{font-size:12px;opacity:.76}.skill{position:fixed;right:7px;bottom:16px;z-index:4}.dodge{position:fixed;left:7px;bottom:16px;z-index:4}.power{position:fixed;left:29%;bottom:29px;width:42%;height:9px;background:#1119}.power i{display:block;height:100%;background:#fff;width:0}.boss{position:fixed;left:12%;right:12%;top:56px;height:12px;background:#111;display:none}.boss i{display:block;height:100%;background:#e33}.toast{position:fixed;top:21%;left:50%;transform:translateX(-50%);background:#111e;padding:10px;border-radius:14px;opacity:0;z-index:9}.toast.on{opacity:1}</style><body><canvas id=c></canvas><div class=hud><div class=pill id=stats></div><div class=pill id=lv></div></div><div class=boss id=bb><i></i></div><div class=power><i id=pow></i></div><button class=skill id=skill>⚡ ABILITÀ</button><button class=dodge id=dodge>💨 SCHIVATA</button><div id=toast class=toast></div><div id=menu class=panel><div class=card><h1>☁️ Sky Slingers</h1><p>V60 · 60 livelli · 25 armi · RPG completo</p><button id=play>GIOCA</button><button class=dark id=heroes>EROI</button><button class=dark id=weapons>ARMI</button><button class=dark id=gacha>GACHA</button><button class=dark id=map>MAPPA</button><button class=dark id=forge>FORGIA</button><button class=dark id=missions>MISSIONI</button><button class=dark id=ach>OBIETTIVI</button><button class=dark id=shop>NEGOZIO</button><p class=small>Capitoli, boss, elite, tesori, combo, reliquie, forgia, missioni e progressione persistente.</p></div></div><div id=sub class="panel hidden"><div class=card><div id=content></div><button class=dark id=back>INDIETRO</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),S=localStorage,K='skySlingers60';let W,H,drag=0,shot=null,objs=[],parts=[],level=1,coins=500,gems=300,score=0,lives=3,hero=0,weapon=0,wxp=0,wlv=1,combo=0,skillCd=0,dodgeCd=0,inv=0,t=0,forge=0,treasures=0,kills=0,bosses=0,shots=0,crit=0,mission=0;const Hs=[['Lampo',3,'Fulmine'],['Nova',3,'Esplosione'],['Astra',4,'Tempesta'],['Riven',4,'Ombra'],['Drakon',5,'Furia del Drago'],['Lyra',4,'Luna'],['Kairo',5,'Raggio Cosmico'],['Vega',5,'Supernova']];const Ws=[['Spada del Vento','🌪️',1,3],['Arco Solare','☀️',1.2,3],['Daga del Crepuscolo','🌒',1.1,3],['Martello Titanico','🔨',1.6,4],['Lancia Stellare','✨',1.35,4],['Falce del Drago','🐉',1.8,5],['Arco del Tuono','⚡',1.55,5],['Spada Lunare','🌙',2,5],['Bastone Astrale','🔮',1.45,4],['Pugno Meteora','☄️',1.7,4],['Katana Cremisi','🩸',1.9,5],['Arco Glaciale','❄️',1.5,4],['Ascia Vulcanica','🌋',2.1,5],['Lama del Vuoto','🕳️',2.2,5],['Corona Celeste','👑',2.4,5],['Lama Solare','🔥',2.0,5],['Arco Nebulare','🌌',2.3,5],['Martello Galattico','💫',2.5,5],['Falce Spettrale','👻',2.25,5],['Lancia del Fulmine','⚡',2.35,5],['Spada Prismatica','🌈',2.55,5],['Arco dell'Aurora','🌅',2.45,5],['Pugno del Titano','🗿',2.7,5],['Lama Celestiale','🪽',2.8,5],['Cuore del Drago','❤️‍🔥',3,5]];function load(){try{let z=JSON.parse(S.getItem(K)||'{}');Object.assign(window,{level:z.level||1,coins:z.coins??500,gems:z.gems??300,score:z.score||0,hero:z.hero||0,weapon:Math.min(z.weapon||0,24),wxp:z.wxp||0,wlv:z.wlv||1,forge:z.forge||0,treasures:z.treasures||0,kills:z.kills||0,bosses:z.bosses||0,shots:z.shots||0})}catch(e){}}function save(){S.setItem(K,JSON.stringify({level,coins,gems,score,hero,weapon,wxp,wlv,forge,treasures,kills,bosses,shots}))}function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();load();function ui(){stats.textContent=`❤️${lives} 🪙${coins} 💎${gems} ⭐${score}`;lv.textContent=`Lv${level}/60 · ${Ws[weapon][0]} +${forge} · 🔥${combo}`}function toast(a){let z=document.getElementById('toast');z.textContent=a;z.classList.add('on');setTimeout(()=>z.classList.remove('on'),1000)}function sling(){return{x:W*.18,y:H*.67}}function chapter(){return Math.ceil(level/10)}function newLevel(){objs=[];let n=Math.min(10,2+Math.floor(level/3));for(let i=0;i<n;i++)objs.push({t:'e',x:W*(.47+i*.052),y:H*(.22+(i%4)*.13),hp:(1+level*.17)*(i%4===3?2.1:1),elite:i%4===3&&level>4});if(level%3===0)objs.push({t:'b',x:W*.78,y:H*.34,hp:18+level*3,m:18+level*3,phase:1});if(level%5===0)objs.push({t:'q',x:W*.63,y:H*.57,w:70,h:28,hp:2});ui();toast(`Capitolo ${chapter()} · Livello ${level}`)}function burst(a,b,ch){for(let i=0;i<10;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:30,ch})}function xp(n){wxp+=n;let need=40+wlv*32;while(wxp>=need&&wlv<30){wxp-=need;wlv++;coins+=10;toast('⚔️ Arma Lv '+wlv);need=40+wlv*32}save()}function finish(){shot=null;drag=0;setTimeout(()=>{if(objs.some(o=>o.t==='e'||o.t==='b')){lives--;combo=0;if(lives<=0){lives=3;level=Math.max(1,level-2);toast('💥 Sconfitta: -2 livelli')}}else{if(level<60){level++;coins+=10;gems+=20}else{toast('🏆 CAMPAGNA V60 COMPLETATA!');gems+=100}}save();newLevel()},300)}function hit(o,p){if(o.t==='b')return Math.hypot(p.x-o.x,p.y-o.y)<50+p.r;if(o.t==='e')return Math.hypot(p.x-o.x,p.y-o.y)<(o.elite?30:24)+p.r;return p.x>o.x-o.w/2-p.r&&p.x<o.x+o.w/2+p.r&&p.y>o.y-o.h/2-p.r&&p.y<o.y+o.h/2+p.r}function skillUse(){if(skillCd)return;let h=Hs[hero],mult=h[1]===5?3.2:h[1]===4?2.6:2.1;objs.filter(o=>o.t==='e'||o.t==='b').forEach(o=>{o.hp-=Ws[weapon][2]*mult*(1+forge*.05);burst(o.x,o.y,'✨')});skillCd=170;combo+=2;ui()}function dodgeUse(){if(dodgeCd)return;inv=50;dodgeCd=105;toast('💨 Schivata perfetta')}play.onclick=()=>{menu.classList.add('hidden');newLevel()};skill.onclick=skillUse;dodge.onclick=dodgeUse;function show(q){sub.classList.remove('hidden');if(q==='heroes')content.innerHTML='<h1>👤 EROI</h1>'+Hs.map((h,i)=>`<div class=item><b>${h[0]} · ${'★'.repeat(h[1])}</b><span class=small>${h[2]}</span><br><button onclick="sh(${i})">${hero===i?'SELEZIONATO':'USA'}</button></div>`).join('');if(q==='weapons')content.innerHTML='<h1>⚔️ ARMI · 25</h1>'+Ws.map((w,i)=>`<div class=item><b>${w[1]} ${w[0]} · ${'★'.repeat(w[3])}</b><span class=small>Potenza ${w[2].toFixed(2)} · Livello ${i+1}</span><br><button onclick="sw(${i})">USA</button></div>`).join('');if(q==='map')content.innerHTML='<h1>🗺️ MAPPA · 60</h1>'+Array.from({length:60},(_,i)=>`<span style="display:inline-flex;width:42px;height:42px;margin:3px;border-radius:50%;align-items:center;justify-content:center;background:${i+1<=level?'#496b49':'#29375f'}">${i+1}</span>`).join('');if(q==='forge')content.innerHTML=`<h1>🔨 FORGIA</h1><p>${Ws[weapon][1]} ${Ws[weapon][0]}</p><p>Forgia +${forge} · danno +${forge*5}%</p><button onclick="up()">POTENZIA · ${150*(forge+1)} 🪙</button>`;if(q==='gacha')content.innerHTML=`<h1>🎲 GACHA</h1><p>💎 ${gems}</p><button onclick="pull(1)">100 💎</button><button onclick="pull(10)">900 💎</button><p class=small>75% ★3 · 20% ★4 · 5% ★5 · pity ogni 10</p><div id=res></div>`;if(q==='missions')content.innerHTML=`<h1>🎯 MISSIONI</h1><div class=item>Colpisci 20 nemici · ${kills%20}/20<br><button onclick="claim(20)">RISCATTA 50 💎</button></div><div class=item>Sconfiggi 3 boss · ${bosses%3}/3<br><button onclick="claim(30)">RISCATTA 100 💎</button></div><div class=item>Effettua 50 tiri · ${shots%50}/50<br><button onclick="claim(10)">RISCATTA 75 💎</button></div>`;if(q==='ach')content.innerHTML=`<h1>🏆 OBIETTIVI</h1><div class=item>⚔️ Cacciatore · ${kills} eliminazioni</div><div class=item>👑 Re dei Boss · ${bosses} boss</div><div class=item>🎁 Tesori · ${treasures}</div><div class=item>🌟 Progresso · livello ${level}/60</div>`;if(q==='shop')content.innerHTML=`<h1>🛒 NEGOZIO</h1><div class=item>💎 100 gemme → 500 🪙<br><button onclick="buy(100)">COMPRA</button></div><div class=item>❤️ +1 vita per la prossima run → 150 🪙<br><button onclick="buyLife()">COMPRA</button></div>`}window.sh=i=>{hero=i;save();show('heroes')};window.sw=i=>{weapon=i;wxp=0;wlv=1;forge=0;save();show('weapons');toast('⚔️ '+Ws[i][0])};window.up=()=>{let cost=150*(forge+1);if(coins<cost)return toast('Monete insufficienti');coins-=cost;forge++;save();show('forge');ui()};window.pull=n=>{let cost=n===10?900:100;if(gems<cost)return toast('Gemme insufficienti');gems-=cost;let out=[];for(let j=0;j<n;j++){let r=Math.random()<.05?5:Math.random()<.25?4:3,a=Ws.filter(w=>w[3]===r);let w=a[Math.random()*a.length|0];weapon=Ws.indexOf(w);out.push(w[1]+' '+w[0]+' ★'+w[3])}document.getElementById('res').innerHTML='<div class=item>'+out.join('<br>')+'</div>';save();ui()};window.claim=n=>{gems+=n;save();show('missions');toast('🎁 Ricompensa!')};window.buy=n=>{if(gems<100)return toast('Gemme insufficienti');gems-=100;coins+=500;save();show('shop');ui()};window.buyLife=()=>{if(coins<150)return toast('Monete insufficienti');coins-=150;lives++;save();show('shop');ui()};heroes.onclick=()=>show('heroes');weapons.onclick=()=>show('weapons');gacha.onclick=()=>show('gacha');map.onclick=()=>show('map');forge.onclick=()=>show('forge');missions.onclick=()=>show('missions');ach.onclick=()=>show('ach');shop.onclick=()=>show('shop');back.onclick=()=>sub.classList.add('hidden');c.onpointerdown=e=>{if(shot)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling();if(Math.hypot(p.x-s.x,p.y-s.y)<105){drag=1;c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(!drag)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling(),d=Math.min(160,Math.hypot(p.x-s.x,p.y-s.y));pow.style.width=d/160*100+'%'};c.onpointerup=e=>{if(!drag)return;let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},s=sling(),dx=s.x-p.x,dy=s.y-p.y,d=Math.hypot(dx,dy);drag=0;pow.style.width=0;if(d>12){shot={x:s.x,y:s.y,vx:dx/d*Math.min(d,160)/17,vy:dy/d*Math.min(d,160)/17,r:16};shots++;save()}};function update(){if(skillCd)skillCd--;if(dodgeCd)dodgeCd--;if(inv)inv--;if(!shot)return;shot.vy+=.2;shot.x+=shot.vx;shot.y+=shot.vy;for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(hit(o,shot)){let dmg=Ws[weapon][2]*(1+Math.min(combo,18)*.035)*(1+forge*.05)*(1+(wlv-1)*.015);if(o.elite)dmg*=.78;if(hero===4&&o.t==='b')dmg*=1.5;if(Math.random()<.08){dmg*=2;crit++;toast('💥 CRIT!')}o.hp-=dmg;combo++;kills+=o.t==='e'?1:0;score+=o.t==='b'?70:o.elite?30:10;coins+=o.t==='b'?30:o.elite?5:1;xp(o.t==='b'?50:8);burst(o.x,o.y,Ws[weapon][1]);if(o.hp<=0){if(o.t==='b'){gems+=35+level;bosses++;toast('🏆 BOSS SCONFITTO!')}if(o.t==='q'){treasures++;gems+=100;coins+=60;toast('🎁 TESORO RARO!')}objs.splice(i,1)}if(Math.hypot(shot.vx,shot.vy)<1.3){finish();break}}}if(shot&&(shot.x>W+90||shot.y>H+90||shot.x<-90))finish();let b=objs.find(o=>o.t==='b');if(b){bb.style.display='block';bb.firstElementChild.style.width=Math.max(0,b.hp/b.m*100)+'%';t++;if(t%95===0&&inv<=0){lives=Math.max(1,lives-1);toast('⚠️ Attacco boss!')}}else bb.style.display='none';ui()}function draw(){x.clearRect(0,0,W,H);x.fillStyle=level%10===0?'#4b356f':level%3===0?'#405d99':level>30?'#263a5d':'#54c7ff';x.fillRect(0,0,W,H);x.fillStyle='#70b85a';x.fillRect(0,H*.72,W,H*.28);let s=sling();x.strokeStyle='#633d24';x.lineWidth=9;x.beginPath();x.moveTo(s.x-12,s.y+48);x.lineTo(s.x,s.y);x.lineTo(s.x+18,s.y+48);x.stroke();objs.forEach(o=>{x.save();x.translate(o.x,o.y);if(o.t==='e'){x.fillStyle=o.elite?'#ff9d2e':'#e55353';x.beginPath();x.arc(0,0,o.elite?25:19,0,7);x.fill();x.fillStyle='#fff';x.fillRect(-8,-6,6,7);x.fillRect(3,-6,6,7);if(o.elite){x.font='16px sans-serif';x.fillText('★',-7,-30)}}else if(o.t==='q'){x.fillStyle='#c78b35';x.fillRect(-o.w/2,-o.h/2,o.w,o.h);x.font='21px sans-serif';x.fillText('💎',-10,7)}else{x.fillStyle='#713d91';x.beginPath();x.arc(0,0,45,0,7);x.fill();x.fillStyle='#fff';x.font='bold 17px sans-serif';x.textAlign='center';x.fillText('BOSS',0,6)}x.restore()});parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l--;x.globalAlpha=p.l/30;x.font='18px sans-serif';x.fillText(p.ch,p.x,p.y)});x.globalAlpha=1;if(shot){x.fillStyle='#ffcc33';x.beginPath();x.arc(shot.x,shot.y,shot.r,0,7);x.fill();x.font='21px sans-serif';x.textAlign='center';x.fillText(Ws[weapon][1],shot.x,shot.y+7)}}function loop(){update();draw();requestAnimationFrame(loop)}ui();loop()</script></body></html>
